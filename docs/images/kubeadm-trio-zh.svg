<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ktrio-title ktrio-desc" id="kubeadm-trio-zh-root">
        <title id="ktrio-title">kubeadm、kubelet 与 kubectl</title>
        <desc id="ktrio-desc">三个独立工具：kubeadm 初始化集群，kubelet 在每个节点管理 Pod 生命周期，kubectl 与 API 服务器交互。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #kubeadm-trio-zh-root { font-family: 'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; }
      #kubeadm-trio-zh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#kubeadm-trio-zh-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="kubeadm-trio-zh-ktrio-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="kubeadm-trio-zh-ktrio-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="kubeadm-trio-zh-ktrio-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Arrows first -->
        <line x1="224" y1="160" x2="224" y2="224" stroke="#5a748f" stroke-width="1.2" marker-end="url(#kubeadm-trio-zh-ktrio-arrow)"/>
        <line x1="480" y1="160" x2="480" y2="224" stroke="#5a748f" stroke-width="1.2" marker-end="url(#kubeadm-trio-zh-ktrio-arrow)"/>
        <line x1="736" y1="160" x2="736" y2="224" stroke="#7c8cff" stroke-width="1.2" marker-end="url(#kubeadm-trio-zh-ktrio-arrow-link)"/>

        <!-- Label for the API call -->
        <rect x="752" y="180" width="76" height="12" rx="2" fill="#f5f8fb"/>
        <text x="790" y="189" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.06em" fill-opacity="0.55">HTTPS API</text>

        <!-- Tools -->
        <g>
          <rect x="104" y="84" width="240" height="76" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="112" y="90" width="56" height="12" rx="2" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.40"/>
          <text x="140" y="99" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">初始化</text>
          <text x="224" y="124" fill="#15324d" font-size="13" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">kubeadm</text>
          <text x="224" y="142" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">集群初始化工具</text>
        </g>
        <g>
          <rect x="360" y="84" width="240" height="76" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="368" y="90" width="56" height="12" rx="2" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.40"/>
          <text x="396" y="99" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">节点代理</text>
          <text x="480" y="124" fill="#15324d" font-size="13" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">kubelet</text>
          <text x="480" y="142" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">运行于每个节点</text>
        </g>
        <g>
          <rect x="616" y="84" width="240" height="76" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="624" y="90" width="48" height="12" rx="2" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.40"/>
          <text x="648" y="99" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">客户端</text>
          <text x="736" y="124" fill="#15324d" font-size="13" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">kubectl</text>
          <text x="736" y="142" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">命令行客户端</text>
        </g>

        <!-- Artifacts -->
        <g>
          <rect x="104" y="224" width="240" height="64" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <text x="224" y="252" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">Kubernetes Cluster</text>
          <text x="224" y="270" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">由初始化创建</text>
        </g>
        <g>
          <rect x="360" y="224" width="240" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="480" y="252" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">Pod 生命周期</text>
          <text x="480" y="270" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">按节点管理</text>
        </g>
        <g>
          <rect x="616" y="224" width="240" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="736" y="252" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">API 服务器</text>
          <text x="736" y="270" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">集群操作</text>
        </g>
      </svg>
