<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deploy-title deploy-desc" id="containerdays-deployment-architecture-root">
        <title id="deploy-title">What setup.sh installs</title>
        <desc id="deploy-desc">Two Helm releases in kube-system: the HAMi scheduler deployment with its webhook, service, TLS secret, config and RBAC, the mock device plugin and mock monitor, and the node whose capacity they register.</desc>
        <defs>
      <style>#containerdays-deployment-architecture-root { font-family: 'Geist', 'Helvetica Neue', sans-serif; }
      #containerdays-deployment-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#containerdays-deployment-architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="containerdays-deployment-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="containerdays-deployment-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8a3c"/></marker>
          <marker id="containerdays-deployment-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: kube-system -->
        <rect x="232" y="96" width="688" height="400" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="500" y="100" width="152" height="12" rx="2" fill="#f5f5f5"/>
        <text x="576" y="109" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">KUBE-SYSTEM · 2 HELM RELEASES</text>

        <!-- Arrows first -->
        <line x1="176" y1="176" x2="256" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-deployment-architecture-arrow)"/>
        <line x1="424" y1="176" x2="456" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-deployment-architecture-arrow)"/>
        <line x1="540" y1="208" x2="540" y2="264" stroke="#0a8a3c" stroke-width="1.4" marker-end="url(#containerdays-deployment-architecture-arrow-accent)"/>
        <path d="M 700,208 V 240 H 664 Q 656,240 656,248 V 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-deployment-architecture-arrow)"/>
        <line x1="424" y1="300" x2="456" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-deployment-architecture-arrow)"/>
        <line x1="704" y1="440" x2="672" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-deployment-architecture-arrow)"/>
        <path d="M 640,400 V 368 H 788 Q 796,368 796,356 V 336" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#containerdays-deployment-architecture-arrow)"/>

        <!-- Arrow labels -->
        <rect x="184" y="158" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="212" y="167" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADMIT</text>

        <rect x="700" y="350" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="724" y="359" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USAGE</text>

        <!-- Node: GPU Pod (input, outside zone) -->
        <rect x="40" y="144" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="144" width="136" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="150" width="28" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="62" y="159" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
        <text x="108" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">GPU Pod</text>
        <text x="108" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fractional request</text>

        <!-- Node: MutatingWebhookConfiguration -->
        <rect x="256" y="144" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="144" width="168" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="264" y="150" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="280" y="159" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADM</text>
        <text x="340" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-webhook</text>
        <text x="340" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rewrites schedulerName</text>

        <!-- Node: Service -->
        <rect x="456" y="144" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="456" y="144" width="168" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="464" y="150" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="478" y="159" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="540" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-scheduler</text>
        <text x="540" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">31998 webhook · 31993 ext</text>

        <!-- Node: TLS secret -->
        <rect x="656" y="144" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="656" y="144" width="152" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="664" y="150" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="678" y="159" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEC</text>
        <text x="732" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">scheduler-tls</text>
        <text x="732" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">certgen hook product</text>

        <!-- Node: Config + RBAC -->
        <rect x="256" y="264" width="168" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="264" width="168" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="264" y="270" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="278" y="279" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CFG</text>
        <text x="340" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">Config + RBAC</text>
        <text x="340" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 ConfigMaps</text>
        <text x="340" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SA + 9 RBAC objects</text>

        <!-- Node: hami-scheduler Deployment (focal) -->
        <rect x="456" y="264" width="216" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="456" y="264" width="216" height="72" rx="6" fill="#10d05d" stroke="#0a8a3c" stroke-width="1" fill-opacity="0.10"/>
        <rect x="464" y="270" width="40" height="12" rx="2" fill="none" stroke="#0a8a3c" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="484" y="279" fill="#0a8a3c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEPLOY</text>
        <text x="564" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-scheduler ×1</text>
        <text x="564" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kube-scheduler + extender</text>
        <text x="564" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">projecthami/hami:v2.10.0</text>

        <!-- Node: hami-mock-monitor -->
        <rect x="704" y="264" width="184" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="264" width="184" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="712" y="270" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="726" y="279" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MON</text>
        <text x="796" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-mock-monitor</text>
        <text x="796" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">usage metrics :9394</text>
        <text x="796" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">completeBinds=true</text>

        <!-- Node: the worker node -->
        <rect x="256" y="400" width="416" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="400" width="416" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="264" y="406" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="280" y="415" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
        <text x="464" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-lab-control-plane</text>
        <text x="464" y="454" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami.io/node-nvidia-register + 2 × A100-40GB (fake)</text>
        <text x="464" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gpu=20 · gpumem=81920 · gpucores=200</text>

        <!-- Node: mock device plugin DS -->
        <rect x="704" y="400" width="184" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="400" width="184" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="712" y="406" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="724" y="415" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DS</text>
        <text x="796" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">mock-device-plugin</text>
        <text x="796" y="454" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DaemonSet on the node</text>
        <text x="796" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">registers gpumem · gpucores</text>

        <!-- Legend strip -->
        <line x1="40" y1="520" x2="920" y2="520" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="548" width="14" height="10" rx="2" fill="#10d05d" stroke="#0a8a3c" stroke-width="1" fill-opacity="0.10"/>
        <text x="60" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">Focal: scheduler deployment</text>

        <rect x="250" y="548" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="270" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">Control-plane resource</text>

        <rect x="430" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="450" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">Runs on the node</text>

        <rect x="590" y="548" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="610" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">Input</text>

        <line x1="680" y1="553" x2="708" y2="553" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#containerdays-deployment-architecture-arrow)"/>
        <text x="716" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">Metrics</text>
      </svg>
