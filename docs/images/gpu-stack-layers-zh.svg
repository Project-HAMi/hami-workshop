          <text x="240" y="114" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">默认放置</text>
        </g>
        <g>
          <rect x="380" y="76" width="200" height="52" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <rect x="388" y="82" width="36" height="12" rx="2" fill="#10d05d" stroke="#10d05d" stroke-width="0.8" fill-opacity="0.12" stroke-opacity="0.60"/>
          <text x="406" y="91" fill="#0a8f3d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HAMI</text>
          <text x="480" y="110" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">HAMi Scheduler</text>
          <text x="480" y="122" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">GPU 共享扩展器</text>
        </g>
        <g>
          <rect x="620" y="76" width="200" height="52" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
