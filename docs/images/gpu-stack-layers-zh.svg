          <text x="480" y="378" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">nvidia-smi</text>
          <text x="480" y="394" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">CLI</text>
        </g>
        <g>
          <rect x="572" y="356" width="152" height="52" rx="6" fill="#ffffff" stroke="#39c6f4" stroke-width="1.2"/>
          <text x="648" y="378" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">DCGM</text>
          <text x="648" y="394" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">诊断</text>
        </g>
        <g>
          <rect x="740" y="356" width="152" height="52" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="816" y="378" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">MIG</text>
          <text x="816" y="394" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">硬件分区</text>
        </g>

