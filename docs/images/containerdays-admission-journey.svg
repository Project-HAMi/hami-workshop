        <rect x="468" y="184" width="8" height="52" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="468" y="328" width="8" height="124" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="644" y="328" width="8" height="88" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="820" y="472" width="8" height="20" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>

