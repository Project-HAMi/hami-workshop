<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="journey-title journey-desc" id="containerdays-admission-journey-root">
        <title id="journey-title">One GPU Pod's journey from kubectl to the node</title>
        <desc id="journey-desc">Sequence of a fractional GPU request: admission rewrites schedulerName, the in-pod scheduler watches it, asks the extender to filter and bind, and the device plugin completes the allocation.</desc>
        <defs>
      <style>#containerdays-admission-journey-root { font-family: 'Geist', 'Helvetica Neue', sans-serif; }
      #containerdays-admission-journey-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#containerdays-admission-journey-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="containerdays-admission-journey-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="containerdays-admission-journey-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8a3c"/></marker>
          <marker id="containerdays-admission-journey-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

