        <text x="824" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">device plugin</text>
        <text x="824" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">on the node</text>

        <!-- Bottom note -->
        <line x1="40" y1="552" x2="920" y2="552" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="570" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">Solid = sync call · dashed = return · dashed open = async · green = the schedulerName rewrite. failurePolicy=Ignore, timeout 10s; non-GPU pods return an empty patch and pass through.</text>
      </svg>
