        <text x="296" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">admission + etcd</text>

        <rect x="400" y="56" width="144" height="64" rx="6" fill="#f5f5f5"/>
