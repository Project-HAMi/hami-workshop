        <line x1="296" y1="120" x2="296" y2="532" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="472" y1="120" x2="472" y2="532" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="648" y1="120" x2="648" y2="532" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="824" y1="120" x2="824" y2="532" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- Messages -->
        <line x1="120" y1="156" x2="296" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-admission-journey-arrow)"/>
        <rect x="180" y="136" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="208" y="145" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /pods</text>

        <line x1="296" y1="192" x2="472" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-admission-journey-arrow)"/>
