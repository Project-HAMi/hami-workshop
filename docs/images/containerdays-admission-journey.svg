        <line x1="648" y1="408" x2="472" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-admission-journey-arrow)"/>
        <rect x="530" y="388" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="558" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /bind</text>

        <line x1="472" y1="444" x2="296" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-admission-journey-arrow)"/>
        <rect x="332" y="424" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="384" y="433" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANNOTATIONS + LOCK</text>

        <line x1="824" y1="480" x2="296" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-admission-journey-arrow)"/>
        <rect x="510" y="460" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="469" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOCATE · UNLOCK</text>

        <line x1="296" y1="516" x2="120" y2="516" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#containerdays-admission-journey-arrow-open)"/>
        <rect x="176" y="496" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="208" y="505" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POD RUNNING</text>

