<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="abus-zh-title abus-zh-desc" id="containerdays-annotation-bus-zh-root">
        <title id="abus-zh-title">HAMi 的注解数据总线</title>
        <desc id="abus-zh-desc">节点与 Pod 注解就是 HAMi 的数据库：设备插件写卡清单、读分配结果，调度扩展器读卡清单与策略、持节点锁写分配，用户写策略覆盖。</desc>
        <defs>
      <style>#containerdays-annotation-bus-zh-root { font-family: 'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif; }
      #containerdays-annotation-bus-zh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#containerdays-annotation-bus-zh-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="containerdays-annotation-bus-zh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="containerdays-annotation-bus-zh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8a3c"/></marker>
          <marker id="containerdays-annotation-bus-zh-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows: left column (plugin, user) -->
        <path d="M 268,196 H 320 V 152 H 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-annotation-bus-zh-arrow)"/>
        <rect x="276" y="130" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGISTER</text>

        <line x1="268" y1="208" x2="368" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-annotation-bus-zh-arrow)"/>
        <rect x="274" y="190" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="318" y="199" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE LOCK</text>

        <line x1="268" y1="384" x2="368" y2="384" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#containerdays-annotation-bus-zh-arrow)"/>
        <rect x="284" y="366" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="324" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TO-ALLOCATE</text>

        <line x1="268" y1="412" x2="368" y2="412" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#containerdays-annotation-bus-zh-arrow)"/>
        <rect x="288" y="394" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="322" y="403" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOCATED</text>

        <line x1="268" y1="440" x2="368" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-annotation-bus-zh-arrow)"/>
        <rect x="292" y="422" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="322" y="431" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text>

        <path d="M 228,476 H 296 V 356 H 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-annotation-bus-zh-arrow)"/>
        <rect x="302" y="452" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="330" y="461" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POLICIES</text>

        <!-- Arrows: right column (extender) -->
        <path d="M 660,152 H 716 V 196 H 752" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#containerdays-annotation-bus-zh-arrow)"/>
        <rect x="664" y="130" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="694" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGISTER</text>

        <line x1="752" y1="208" x2="660" y2="208" stroke="#0a8a3c" stroke-width="1.4" marker-end="url(#containerdays-annotation-bus-zh-arrow-accent)"/>
        <rect x="672" y="214" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="223" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TAKE LOCK</text>

        <line x1="752" y1="356" x2="660" y2="356" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#containerdays-annotation-bus-zh-arrow)"/>
        <rect x="676" y="338" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="704" y="347" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POLICIES</text>

        <line x1="752" y1="384" x2="660" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-annotation-bus-zh-arrow)"/>
        <rect x="668" y="366" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="708" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TO-ALLOCATE</text>

