        <text x="706" y="403" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOCATED</text>

        <!-- Store panel: Node annotations -->
        <rect x="368" y="96" width="292" height="164" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="96" width="292" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="376" y="102" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="394" y="111" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
        <text x="514" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-lab-control-plane</text>
        <line x1="384" y1="136" x2="644" y2="136" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="384" y="154" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">node-nvidia-register</text>
        <text x="384" y="172" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" fill-opacity="0.55">卡清单：显存、算力、健康</text>
        <line x1="384" y1="180" x2="644" y2="180" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="384" y="198" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">node-handshake</text>
        <text x="384" y="216" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" fill-opacity="0.55">插件与调度器的心跳</text>
        <line x1="384" y1="220" x2="644" y2="220" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="384" y="238" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">mutex.lock</text>
        <text x="384" y="256" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" fill-opacity="0.55">绑定互斥锁 · 另有 status 容量</text>

        <!-- Store panel: Pod annotations -->
        <rect x="368" y="300" width="292" height="216" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="300" width="292" height="216" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="376" y="306" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="392" y="315" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
        <text x="514" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">share-1</text>
        <line x1="384" y1="340" x2="644" y2="340" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="384" y="358" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">gpu/node-scheduler-policy</text>
        <text x="384" y="376" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" fill-opacity="0.55">节点与卡两级的放置策略</text>
        <line x1="384" y1="384" x2="644" y2="384" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="384" y="402" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">vgpu-devices-to-allocate</text>
        <text x="384" y="420" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" fill-opacity="0.55">Allocate 前写入的待分配清单</text>
        <line x1="384" y1="424" x2="644" y2="424" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="384" y="442" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">vgpu-devices-allocated</text>
        <text x="384" y="460" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" fill-opacity="0.55">每容器 uuid、显存、算力</text>
        <line x1="384" y1="464" x2="644" y2="464" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="384" y="482" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">bind-phase</text>
        <text x="384" y="500" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" fill-opacity="0.55">allocating → success 后释放锁</text>

        <!-- Actor: device plugin -->
        <rect x="64" y="180" width="204" height="240" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="180" width="204" height="240" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="186" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="88" y="195" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLUG</text>
        <text x="166" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">HAMi 设备插件</text>
        <text x="166" y="234" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">节点上的 DaemonSet</text>
        <text x="166" y="262" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">真实卡上读 NVML，</text>
        <text x="166" y="280" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">注册一次卡清单，</text>
        <text x="166" y="298" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">之后执行 Allocate：</text>
        <text x="166" y="316" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">挂载设备、注入</text>
        <text x="166" y="334" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">libvgpu.so、标记成功</text>
        <text x="166" y="362" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle" fill-opacity="0.55">本实验中 mock 插件</text>
        <text x="166" y="380" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle" fill-opacity="0.55">跳过此步，由 hami-</text>
        <text x="166" y="398" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle" fill-opacity="0.55">mock-monitor 的</text>
        <text x="166" y="416" fill="#2d3142" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle" fill-opacity="0.55">completeBinds 代劳</text>

        <!-- Actor: scheduler extender (focal) -->
        <rect x="752" y="180" width="168" height="240" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="180" width="168" height="240" rx="6" fill="#10d05d" stroke="#0a8a3c" stroke-width="1" fill-opacity="0.10"/>
