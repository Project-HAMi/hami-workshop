        <text x="776" y="195" fill="#0a8a3c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="836" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">调度扩展器</text>
        <text x="836" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Filter · Bind</text>
        <text x="836" y="264" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">Filter：读卡清单</text>
        <text x="836" y="282" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">与策略，逐卡检查，</text>
        <text x="836" y="300" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">按 binpack 或</text>
        <text x="836" y="318" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">spread 打分</text>
        <text x="836" y="346" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">Bind：拿节点锁，</text>
        <text x="836" y="364" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">写分配结果，</text>
        <text x="836" y="382" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">等 success 后</text>
        <text x="836" y="400" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">释放锁</text>

