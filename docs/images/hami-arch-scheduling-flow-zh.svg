<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hasf-title hasf-desc" id="hami-arch-scheduling-flow-zh-root">
        <title id="hasf-title">HAMi GPU 调度流程</title>
        <desc id="hasf-desc">申请 2GB 显存的 Pod 由 kube-scheduler 调度，期间调用 HAMi 扩展器，绑定节点后 HAMi device plugin 切分显存并为容器挂载设备。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #hami-arch-scheduling-flow-zh-root { font-family: 'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; }
      #hami-arch-scheduling-flow-zh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#hami-arch-scheduling-flow-zh-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="hami-arch-scheduling-flow-zh-hasf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="hami-arch-scheduling-flow-zh-hasf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="hami-arch-scheduling-flow-zh-hasf-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Zones -->
        <rect x="100" y="40" width="760" height="110" rx="8"
              fill="#15324d" stroke="#15324d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="424" y="34" width="112" height="12" rx="2" fill="#f5f8fb"/>
        <text x="480" y="43" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">用户负载</text>

        <rect x="100" y="186" width="760" height="130" rx="8"
              fill="#15324d" stroke="#15324d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="396" y="180" width="168" height="12" rx="2" fill="#f5f8fb"/>
        <text x="480" y="189" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">KUBERNETES 调度</text>

        <rect x="100" y="352" width="760" height="280" rx="8"
              fill="#15324d" stroke="#15324d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="428" y="346" width="104" height="12" rx="2" fill="#f5f8fb"/>
        <text x="480" y="355" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">节点之上</text>

        <!-- Arrows first -->
        <path d="M 480,122 V 164 Q 480,172 472,172 H 358 Q 350,172 350,180 V 214"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-scheduling-flow-zh-hasf-arrow)"/>
        <line x1="450" y1="240" x2="530" y2="240" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-scheduling-flow-zh-hasf-arrow)"/>
        <line x1="530" y1="258" x2="450" y2="258" stroke="#5a748f" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#hami-arch-scheduling-flow-zh-hasf-arrow)"/>
        <line x1="350" y1="278" x2="350" y2="380" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-scheduling-flow-zh-hasf-arrow)"/>
        <line x1="350" y1="436" x2="350" y2="460" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-scheduling-flow-zh-hasf-arrow)"/>
        <line x1="350" y1="524" x2="350" y2="548" stroke="#0a8f3d" stroke-width="1.4" marker-end="url(#hami-arch-scheduling-flow-zh-hasf-arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="452" y="222" width="76" height="12" rx="2" fill="#f5f8fb"/>
        <text x="490" y="231" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.06em" fill-opacity="0.55">调用扩展器</text>
        <rect x="452" y="264" width="76" height="12" rx="2" fill="#f5f8fb"/>
        <text x="490" y="273" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.06em" fill-opacity="0.55">返回决策</text>
        <rect x="358" y="318" width="44" height="12" rx="2" fill="#f5f8fb"/>
        <text x="380" y="327" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.06em" fill-opacity="0.55">绑定</text>
        <rect x="358" y="440" width="56" height="12" rx="2" fill="#f5f8fb"/>
        <text x="386" y="449" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.06em" fill-opacity="0.55">创建</text>
        <rect x="358" y="528" width="96" height="12" rx="2" fill="#f5f8fb"/>
        <text x="406" y="537" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.06em" fill-opacity="0.55">切分 + 挂载</text>

        <!-- Pod -->
        <g>
          <rect x="380" y="66" width="200" height="56" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="388" y="72" width="36" height="12" rx="2" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.40"/>
          <text x="406" y="81" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">WORKLOAD</text>
          <text x="480" y="102" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">Pod</text>
          <text x="480" y="112" fill="#5a748f" font-size="8" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">申请 2GB 显存</text>
        </g>

        <!-- kube-scheduler + hami-scheduler -->
        <g>
          <rect x="250" y="214" width="200" height="64" rx="6" fill="#ffffff" stroke="#7c8cff" stroke-width="1.2"/>
          <text x="350" y="238" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">kube-scheduler</text>
          <text x="350" y="254" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">过滤 + 打分</text>
        </g>
        <g>
          <rect x="530" y="214" width="200" height="64" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <rect x="538" y="220" width="36" height="12" rx="2" fill="#10d05d" stroke="#10d05d" stroke-width="0.8" fill-opacity="0.12" stroke-opacity="0.60"/>
          <text x="556" y="229" fill="#0a8f3d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HAMI</text>
          <text x="630" y="250" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">hami-scheduler</text>
          <text x="630" y="266" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">GPU 调度</text>
        </g>

        <!-- Node column -->
        <g>
          <rect x="250" y="380" width="200" height="56" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="350" y="404" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">kubelet</text>
          <text x="350" y="420" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">节点代理</text>
        </g>
        <g>
          <rect x="250" y="460" width="200" height="64" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <rect x="258" y="466" width="36" height="12" rx="2" fill="#10d05d" stroke="#10d05d" stroke-width="0.8" fill-opacity="0.12" stroke-opacity="0.60"/>
          <text x="276" y="475" fill="#0a8f3d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HAMI</text>
          <text x="350" y="496" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">hami-device-plugin</text>
          <text x="350" y="512" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">显存切分</text>
        </g>
        <g>
          <rect x="250" y="548" width="200" height="56" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="350" y="572" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">GPU 硬件</text>
          <text x="350" y="588" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">物理设备</text>
        </g>
      </svg>
