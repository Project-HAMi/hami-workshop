<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gda-title gda-desc" id="gpu-driver-architecture-zh-root">
        <title id="gda-title">Linux GPU 驱动架构</title>
        <desc id="gda-desc">CLI 工具调用用户态 NVML 库，穿越内核态 nvidia.ko 模块，最终到达 GPU 设备。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #gpu-driver-architecture-zh-root { font-family: 'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; }
      #gpu-driver-architecture-zh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#gpu-driver-architecture-zh-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="gpu-driver-architecture-zh-gda-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="gpu-driver-architecture-zh-gda-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="gpu-driver-architecture-zh-gda-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Zones (drawn first) -->
        <rect x="140" y="40" width="680" height="140" rx="8"
              fill="#15324d" stroke="#15324d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="408" y="34" width="144" height="12" rx="2" fill="#f5f8fb"/>
        <text x="480" y="43" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">用户态</text>

        <rect x="140" y="220" width="680" height="120" rx="8"
              fill="#15324d" stroke="#15324d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="402" y="214" width="156" height="12" rx="2" fill="#f5f8fb"/>
        <text x="480" y="223" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">内核态</text>

        <rect x="140" y="380" width="680" height="120" rx="8"
              fill="#15324d" stroke="#15324d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="414" y="374" width="132" height="12" rx="2" fill="#f5f8fb"/>
        <text x="480" y="383" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">硬件</text>

        <!-- Arrows first -->
        <line x1="430" y1="110" x2="530" y2="110" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gpu-driver-architecture-zh-gda-arrow)"/>
        <path d="M 640,138 V 184 Q 640,192 632,192 H 488 Q 480,192 480,200 V 252"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gpu-driver-architecture-zh-gda-arrow)"/>
        <line x1="480" y1="308" x2="480" y2="412" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gpu-driver-architecture-zh-gda-arrow)"/>

        <!-- Nodes -->
        <g>
          <rect x="210" y="82" width="220" height="56" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="320" y="106" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">nvidia-smi</text>
          <text x="320" y="122" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">CLI 工具</text>
        </g>
        <g>
          <rect x="530" y="82" width="220" height="56" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="640" y="106" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">libnvidia-ml.so</text>
          <text x="640" y="122" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">用户态库</text>
        </g>
        <g>
          <rect x="370" y="252" width="220" height="56" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="378" y="258" width="48" height="12" rx="2" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.40"/>
          <text x="402" y="267" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">KMOD</text>
          <text x="480" y="286" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">nvidia.ko</text>
          <text x="480" y="302" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">内核模块</text>
        </g>
        <g>
          <rect x="370" y="412" width="220" height="56" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <text x="480" y="436" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">GPU device</text>
          <text x="480" y="452" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">PCI 硬件</text>
        </g>
      </svg>
