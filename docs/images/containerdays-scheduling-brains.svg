<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brains-title brains-desc" id="containerdays-scheduling-brains-root">
        <title id="brains-title">One isolation layer, several scheduling brains</title>
        <desc id="brains-desc">A fractional GPU request is routed by admission to the HAMi extender, Volcano, KAI Scheduler or the DRA path, and every path converges on the same HAMi-core isolation library.</desc>
        <defs>
      <style>#containerdays-scheduling-brains-root { font-family: 'Geist', 'Helvetica Neue', sans-serif; }
      #containerdays-scheduling-brains-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#containerdays-scheduling-brains-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="containerdays-scheduling-brains-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="containerdays-scheduling-brains-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8a3c"/></marker>
          <marker id="containerdays-scheduling-brains-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows first (behind boxes) -->
