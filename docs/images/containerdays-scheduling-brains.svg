        <text x="264" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fractional request</text>

        <!-- Node: Admission -->
        <rect x="408" y="64" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="408" y="64" width="144" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="416" y="70" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
