        <text x="480" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">Admission</text>
        <text x="480" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mutating webhook</text>

        <!-- Node: HAMi-DRA -->
        <rect x="752" y="64" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="64" width="144" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="760" y="70" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
