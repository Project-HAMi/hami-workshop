        <line x1="552" y1="96" x2="752" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-scheduling-brains-arrow)"/>
        <line x1="824" y1="128" x2="824" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-scheduling-brains-arrow)"/>

        <path d="M 436,128 V 176 H 156 Q 148,176 148,184 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-scheduling-brains-arrow)"/>
        <line x1="480" y1="128" x2="480" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-scheduling-brains-arrow)"/>
        <path d="M 524,128 V 176 H 640 Q 648,176 648,184 V 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-scheduling-brains-arrow)"/>

        <path d="M 148,288 V 344 H 438 Q 446,344 446,352 V 400" fill="none" stroke="#0a8a3c" stroke-width="1.4" marker-end="url(#containerdays-scheduling-brains-arrow-accent)"/>
