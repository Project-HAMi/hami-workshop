        <text x="824" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">HAMi-DRA</text>
        <text x="824" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gpu → claim</text>

        <!-- Node: kube-scheduler -->
        <rect x="752" y="224" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="224" width="144" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="760" y="230" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="774" y="239" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
        <text x="824" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">kube-scheduler</text>
        <text x="824" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DRA driver · 1.34+</text>

        <!-- Node: HAMi extender (brain) -->
        <rect x="64" y="224" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="224" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="230" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="90" y="239" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HAMI</text>
        <text x="148" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">HAMi extender</text>
        <text x="148" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gpumem · gpucores</text>

        <!-- Node: Volcano (brain) -->
        <rect x="400" y="224" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="224" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="230" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="426" y="239" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VLCN</text>
        <text x="480" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">Volcano</text>
        <text x="480" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vgpu-* · gang · queue</text>

        <!-- Node: KAI Scheduler (brain) -->
        <rect x="576" y="224" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="576" y="224" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="584" y="230" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="598" y="239" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KAI</text>
        <text x="648" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">KAI Scheduler</text>
        <text x="648" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gpu-fraction · topo</text>

        <!-- Node: HAMi-core (focal) -->
        <rect x="400" y="400" width="232" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="400" width="232" height="72" rx="6" fill="#10d05d" stroke="#0a8a3c" stroke-width="1" fill-opacity="0.10"/>
        <rect x="408" y="406" width="32" height="12" rx="2" fill="none" stroke="#0a8a3c" stroke-width="0.8" stroke-opacity="0.50"/>
