        <text x="516" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">HAMi-core</text>
        <text x="516" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">libvgpu.so · hard isolation</text>

        <!-- Legend strip -->
        <line x1="40" y1="500" x2="920" y2="500" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="532" width="14" height="10" rx="2" fill="#10d05d" stroke="#0a8a3c" stroke-width="1" fill-opacity="0.10"/>
        <text x="60" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">Isolation layer (shared)</text>

        <rect x="240" y="532" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="260" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">Scheduling brain</text>

        <rect x="400" y="532" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="420" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">Kubernetes component</text>

        <rect x="600" y="532" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="620" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">Input</text>
