        <!-- Arrow labels -->
        <rect x="636" y="78" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="652" y="87" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DRA</text>

        <rect x="272" y="158" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="300" y="167" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEFAULT</text>

        <rect x="488" y="164" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="516" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOLCANO</text>

