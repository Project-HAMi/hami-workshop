<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="amdroles-title amdroles-desc" id="amd-lab-roles-zh-root">
        <title id="amdroles-title">AMD 节点上的职责分工</title>
        <desc id="amdroles-desc">Pod 申请 AMD GPU 资源，HAMi 调度器选定节点与份额，kubelet 调用 AMD device plugin，容器内 libamvgpu.so 强制显存上限，ROCm 应用 CU 掩码。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #amd-lab-roles-zh-root { font-family: 'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; }
      #amd-lab-roles-zh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#amd-lab-roles-zh-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="amd-lab-roles-zh-amdroles-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="amd-lab-roles-zh-amdroles-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="amd-lab-roles-zh-amdroles-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Arrows first -->
        <line x1="480" y1="104" x2="480" y2="144" stroke="#5a748f" stroke-width="1.2" marker-end="url(#amd-lab-roles-zh-amdroles-arrow)"/>
        <line x1="480" y1="208" x2="480" y2="248" stroke="#5a748f" stroke-width="1.2" marker-end="url(#amd-lab-roles-zh-amdroles-arrow)"/>
        <line x1="480" y1="312" x2="480" y2="352" stroke="#5a748f" stroke-width="1.2" marker-end="url(#amd-lab-roles-zh-amdroles-arrow)"/>
        <line x1="480" y1="416" x2="480" y2="440" stroke="#5a748f" stroke-width="1.2" marker-end="url(#amd-lab-roles-zh-amdroles-arrow)"/>
        <path d="M 360,504 V 520 Q 360,528 352,528 H 248 Q 240,528 240,536"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#amd-lab-roles-zh-amdroles-arrow)"/>
        <path d="M 600,504 V 520 Q 600,528 608,528 H 712 Q 720,528 720,536"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#amd-lab-roles-zh-amdroles-arrow)"/>

        <!-- Request -->
        <g>
          <rect x="300" y="40" width="360" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="308" y="46" width="36" height="12" rx="2" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.40"/>
          <text x="326" y="55" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">WORKLOAD</text>
          <text x="480" y="76" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">Pod</text>
          <text x="480" y="92" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">amd.com/gpu · gpucores · gpumem</text>
        </g>

        <!-- HAMi scheduler -->
        <g>
          <rect x="300" y="144" width="360" height="64" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <rect x="308" y="150" width="36" height="12" rx="2" fill="#10d05d" stroke="#10d05d" stroke-width="0.8" fill-opacity="0.12" stroke-opacity="0.60"/>
          <text x="326" y="159" fill="#0a8f3d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HAMI</text>
          <text x="480" y="180" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">HAMi scheduler</text>
          <text x="480" y="196" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">选定节点 + 份额</text>
        </g>

        <!-- kubelet -->
        <g>
          <rect x="300" y="248" width="360" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="480" y="272" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">kubelet</text>
          <text x="480" y="288" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">节点代理</text>
        </g>

        <!-- AMD device plugin -->
        <g>
          <rect x="300" y="352" width="360" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="480" y="376" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">AMD device plugin</text>
          <text x="480" y="392" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">设置 HSA_CU_MASK 和显存上限</text>
        </g>

        <!-- Container -->
        <g>
          <rect x="300" y="440" width="360" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="480" y="464" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">容器</text>
          <text x="480" y="480" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">运行 LLM</text>
        </g>

        <!-- Hook -->
        <g>
          <rect x="90" y="536" width="300" height="64" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <text x="240" y="560" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">libamvgpu.so</text>
          <text x="240" y="576" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">LD_AUDIT 钩子 · 强制显存上限</text>
        </g>

        <!-- ROCm -->
        <g>
          <rect x="570" y="536" width="300" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="720" y="560" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">ROCm 运行时</text>
          <text x="720" y="576" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">应用 CU 掩码</text>
        </g>
      </svg>
