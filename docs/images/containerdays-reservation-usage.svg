<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="resv-title resv-desc" id="containerdays-reservation-usage-root">
        <title id="resv-title">Reservation vs usage</title>
        <desc id="resv-desc">Two HAMi metric families: the scheduler exposes reservation metrics on port 9395, the monitor exposes usage metrics on port 9394, and on a healthy card allocation stays above usage.</desc>
        <defs>
      <style>#containerdays-reservation-usage-root { font-family: 'Geist', 'Helvetica Neue', sans-serif; }
      #containerdays-reservation-usage-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#containerdays-reservation-usage-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="containerdays-reservation-usage-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="containerdays-reservation-usage-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8a3c"/></marker>
          <marker id="containerdays-reservation-usage-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="64" y="136" width="384" height="352" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="169" y="140" width="174" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="149" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">SCHEDULER :9395 · RESERVED</text>

        <rect x="512" y="136" width="384" height="352" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="619" y="140" width="170" height="12" rx="2" fill="#f5f5f5"/>
        <text x="704" y="149" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">MONITOR :9394 · USED</text>

        <!-- Relation arrow -->
        <line x1="448" y1="312" x2="512" y2="312" stroke="#0a8a3c" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#containerdays-reservation-usage-arrow-accent)"/>
        <rect x="440" y="294" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="303" fill="#0a8a3c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOC ≥ USED</text>

        <!-- Metric panel: card allocation -->
        <rect x="88" y="176" width="336" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="176" width="336" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="96" y="182" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="112" y="191" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CARD</text>
        <text x="256" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">Per card</text>
        <text x="256" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_gpu_memory_allocated_bytes</text>
        <text x="256" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_gpu_core_allocated_ratio</text>
        <text x="256" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_node_gpu_memory_allocated_ratio</text>

        <!-- Metric panel: pod allocation -->
        <rect x="88" y="328" width="336" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="88" y="328" width="336" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="96" y="334" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="110" y="343" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
        <text x="256" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">Per pod</text>
        <text x="256" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_vgpu_memory_allocated_bytes</text>
        <text x="256" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_vgpu_core_allocated_ratio</text>
        <text x="256" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_gpu_shared_count</text>

        <!-- Metric panel: container usage -->
        <rect x="536" y="176" width="336" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="536" y="176" width="336" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="544" y="182" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="562" y="191" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CNTR</text>
        <text x="704" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">Per container</text>
        <text x="704" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_vgpu_memory_used_bytes</text>
        <text x="704" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_vgpu_memory_limit_bytes</text>
        <text x="704" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_container_device_utilization_ratio</text>

        <!-- Metric panel: card usage -->
        <rect x="536" y="328" width="336" height="128" rx="6" fill="#f5f5f5"/>
        <rect x="536" y="328" width="336" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="544" y="334" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="560" y="343" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CARD</text>
        <text x="704" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">Per card</text>
        <text x="704" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_host_gpu_memory_used_bytes</text>
        <text x="704" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami_host_gpu_utilization_ratio</text>
      </svg>
