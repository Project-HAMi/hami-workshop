<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hasys-title hasys-desc" id="hami-arch-system-root">
        <title id="hasys-title">Complete HAMi lab system</title>
        <desc id="hasys-desc">AI workloads at the top talk to the Kubernetes control plane; HAMi sits between control plane and the NVIDIA runtime stack on the nodes; Prometheus and the WebUI observe; a Tesla T4 sits at the bottom.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #hami-arch-system-root { font-family: 'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif; }
      #hami-arch-system-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#hami-arch-system-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="hami-arch-system-hasys-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="hami-arch-system-hasys-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="hami-arch-system-hasys-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Bands -->
        <rect x="60" y="36" width="840" height="104" rx="8" fill="#15324d" stroke="#15324d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <text x="76" y="56" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" letter-spacing="0.14em" fill-opacity="0.40">AI WORKLOADS</text>

        <rect x="60" y="164" width="840" height="104" rx="8" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="76" y="184" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" letter-spacing="0.14em" fill-opacity="0.40">KUBERNETES CONTROL PLANE</text>

        <rect x="60" y="292" width="840" height="104" rx="8" fill="#15324d" stroke="#15324d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <text x="76" y="312" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" letter-spacing="0.14em" fill-opacity="0.40">HAMi GPU SCHEDULING</text>

        <rect x="60" y="420" width="840" height="104" rx="8" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="76" y="440" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" letter-spacing="0.14em" fill-opacity="0.40">NVIDIA GPU RUNTIME (NODE)</text>

        <rect x="60" y="548" width="840" height="104" rx="8" fill="#15324d" stroke="#15324d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <text x="76" y="568" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" letter-spacing="0.14em" fill-opacity="0.40">MONITORING + VISUALIZATION</text>

        <rect x="60" y="676" width="840" height="104" rx="8" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="76" y="696" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" letter-spacing="0.14em" fill-opacity="0.40">HARDWARE</text>

        <!-- Arrows first -->
        <path d="M 480,124 V 148 Q 480,156 472,156 H 448 Q 440,156 440,164 V 200"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-system-hasys-arrow)"/>
        <path d="M 640,98 H 908 Q 916,98 916,106 V 730 Q 916,738 908,738 H 580"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-system-hasys-arrow)"/>
        <path d="M 480,712 V 668 Q 480,660 472,660 H 160 Q 152,660 152,652 V 508"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-system-hasys-arrow)"/>
        <line x1="240" y1="482" x2="272" y2="482" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-system-hasys-arrow)"/>
        <line x1="360" y1="456" x2="360" y2="252" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-system-hasys-arrow)"/>
        <line x1="480" y1="328" x2="480" y2="252" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-system-hasys-arrow)"/>
        <path d="M 720,328 V 276 Q 720,268 728,268 H 752 Q 760,268 760,260 V 252"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-system-hasys-arrow)"/>
        <path d="M 584,508 V 532 Q 584,540 576,540 H 328 Q 320,540 320,548 V 584"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-system-hasys-arrow)"/>
        <line x1="420" y1="610" x2="540" y2="610" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-system-hasys-arrow)"/>

        <!-- Side label on the long right-margin route -->
        <rect x="836" y="398" width="72" height="12" rx="2" fill="#f5f8fb"/>
        <text x="908" y="407" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace"
              text-anchor="end" letter-spacing="0.06em" fill-opacity="0.55">VIA TOOLKIT</text>
        <rect x="488" y="314" width="68" height="12" rx="2" fill="#f5f8fb"/>
        <text x="556" y="323" fill="#15324d" font-size="8" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace"
              letter-spacing="0.06em" fill-opacity="0.55">REGISTERS</text>

        <!-- Workloads -->
        <g>
          <rect x="320" y="72" width="320" height="52" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="480" y="94" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">AI Workloads</text>
          <text x="480" y="110" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">training + inference</text>
        </g>

        <!-- Control plane -->
        <g>
          <rect x="280" y="200" width="320" height="52" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="440" y="222" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">kube-apiserver</text>
          <text x="440" y="238" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">cluster API</text>
        </g>
        <g>
          <rect x="660" y="200" width="200" height="52" rx="6" fill="#ffffff" stroke="#7c8cff" stroke-width="1.2"/>
          <text x="760" y="222" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">kube-scheduler</text>
          <text x="760" y="238" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">default planner</text>
        </g>

        <!-- HAMi layer -->
        <g>
          <rect x="380" y="328" width="200" height="52" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <rect x="388" y="334" width="36" height="12" rx="2" fill="#10d05d" stroke="#10d05d" stroke-width="0.8" fill-opacity="0.12" stroke-opacity="0.60"/>
          <text x="406" y="343" fill="#0a8f3d" font-size="7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HAMI</text>
          <text x="480" y="362" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">hami-device-plugin</text>
        </g>
        <g>
          <rect x="620" y="328" width="200" height="52" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <rect x="628" y="334" width="36" height="12" rx="2" fill="#10d05d" stroke="#10d05d" stroke-width="0.8" fill-opacity="0.12" stroke-opacity="0.60"/>
          <text x="646" y="343" fill="#0a8f3d" font-size="7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HAMI</text>
          <text x="720" y="362" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">hami-scheduler</text>
        </g>

        <!-- GPU runtime band -->
        <g>
          <rect x="64" y="456" width="176" height="52" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="152" y="478" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">nvidia-driver</text>
          <text x="152" y="494" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">daemonset</text>
        </g>
        <g>
          <rect x="272" y="456" width="176" height="52" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="360" y="478" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">container-toolkit</text>
          <text x="360" y="494" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">GPU injection</text>
        </g>
        <g>
          <rect x="496" y="456" width="176" height="52" rx="6" fill="#ffffff" stroke="#39c6f4" stroke-width="1.2"/>
          <text x="584" y="478" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">dcgm-exporter</text>
          <text x="584" y="494" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">GPU metrics</text>
        </g>
        <g>
          <rect x="704" y="456" width="176" height="52" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="792" y="478" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">gpu-feature-discovery</text>
          <text x="792" y="494" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">labels nodes</text>
        </g>

        <!-- Monitoring + viz band -->
        <g>
          <rect x="220" y="584" width="200" height="52" rx="6" fill="#ffffff" stroke="#39c6f4" stroke-width="1.2"/>
          <text x="320" y="606" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">Prometheus</text>
          <text x="320" y="622" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">metrics store</text>
        </g>
        <g>
          <rect x="540" y="584" width="200" height="52" rx="6" fill="#ffffff" stroke="#39c6f4" stroke-width="1.2"/>
          <text x="640" y="606" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">HAMi WebUI</text>
          <text x="640" y="622" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">utilization view</text>
        </g>

        <!-- Hardware -->
        <g>
          <rect x="380" y="712" width="200" height="52" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="480" y="734" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">Tesla T4 GPU</text>
          <text x="480" y="750" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">16GB, on node</text>
        </g>
      </svg>
