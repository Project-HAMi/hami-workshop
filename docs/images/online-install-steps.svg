<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oinst-title oinst-desc" id="online-install-steps-root">
        <title id="oinst-title">HAMi installation, six steps</title>
        <desc id="oinst-desc">Create a GCP VM, install Helm, install Kubernetes, install Prometheus, install the GPU Operator, and finally install HAMi.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #online-install-steps-root { font-family: 'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif; }
      #online-install-steps-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#online-install-steps-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="online-install-steps-oinst-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="online-install-steps-oinst-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="online-install-steps-oinst-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Arrows first -->
        <line x1="360" y1="100" x2="396" y2="100" stroke="#5a748f" stroke-width="1.2" marker-end="url(#online-install-steps-oinst-arrow)"/>
        <line x1="564" y1="100" x2="600" y2="100" stroke="#5a748f" stroke-width="1.2" marker-end="url(#online-install-steps-oinst-arrow)"/>
        <path d="M 684,136 V 172 Q 684,180 676,180 H 168 Q 160,180 160,188 V 240 Q 160,248 168,248 H 192"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#online-install-steps-oinst-arrow)"/>
        <line x1="360" y1="252" x2="396" y2="252" stroke="#5a748f" stroke-width="1.2" marker-end="url(#online-install-steps-oinst-arrow)"/>
        <line x1="564" y1="252" x2="600" y2="252" stroke="#5a748f" stroke-width="1.2" marker-end="url(#online-install-steps-oinst-arrow)"/>

        <!-- Row 1 -->
        <g>
          <rect x="192" y="64" width="168" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="200" y="70" width="20" height="14" rx="2" fill="#15324d" fill-opacity="0.10"/>
          <text x="210" y="81" fill="#15324d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">1</text>
          <text x="276" y="102" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">Create GCP VM</text>
          <text x="276" y="118" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">GPU-enabled instance</text>
        </g>
        <g>
          <rect x="396" y="64" width="168" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="404" y="70" width="20" height="14" rx="2" fill="#15324d" fill-opacity="0.10"/>
          <text x="414" y="81" fill="#15324d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">2</text>
          <text x="480" y="102" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">Install Helm</text>
          <text x="480" y="118" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">package manager</text>
        </g>
        <g>
          <rect x="600" y="64" width="168" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="608" y="70" width="20" height="14" rx="2" fill="#15324d" fill-opacity="0.10"/>
          <text x="618" y="81" fill="#15324d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">3</text>
          <text x="684" y="102" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">Install Kubernetes</text>
          <text x="684" y="118" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">kubeadm cluster</text>
        </g>

        <!-- Row 2 -->
        <g>
          <rect x="192" y="216" width="168" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="200" y="222" width="20" height="14" rx="2" fill="#15324d" fill-opacity="0.10"/>
          <text x="210" y="233" fill="#15324d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">4</text>
          <text x="276" y="254" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">Install Prometheus</text>
          <text x="276" y="270" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">monitoring stack</text>
        </g>
        <g>
          <rect x="396" y="216" width="168" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="404" y="222" width="20" height="14" rx="2" fill="#15324d" fill-opacity="0.10"/>
          <text x="414" y="233" fill="#15324d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">5</text>
          <text x="480" y="254" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">Install GPU Operator</text>
          <text x="480" y="270" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">driver + toolkit</text>
        </g>
        <g>
          <rect x="600" y="216" width="168" height="72" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <rect x="608" y="222" width="20" height="14" rx="2" fill="#10d05d" fill-opacity="0.14"/>
          <text x="618" y="233" fill="#0a8f3d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">6</text>
          <text x="684" y="254" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">Install HAMi</text>
          <text x="684" y="270" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">GPU scheduling</text>
        </g>
      </svg>
