<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="podchain-title podchain-desc" id="gpu-stack-pod-chain-zh-root">
        <title id="podchain-title">GPU Pod 完整依赖链</title>
        <desc id="podchain-desc">Pod 由 containerd 借助 NVIDIA Container Toolkit 启动，CUDA 运行在用户态驱动库上，经内核 nvidia.ko，沿 PCIe 到达 GPU。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #gpu-stack-pod-chain-zh-root { font-family: 'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; }
      #gpu-stack-pod-chain-zh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#gpu-stack-pod-chain-zh-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="gpu-stack-pod-chain-zh-podchain-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="gpu-stack-pod-chain-zh-podchain-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="gpu-stack-pod-chain-zh-podchain-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Arrows first -->
        <line x1="258" y1="116" x2="294" y2="116" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gpu-stack-pod-chain-zh-podchain-arrow)"/>
        <line x1="462" y1="116" x2="498" y2="116" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gpu-stack-pod-chain-zh-podchain-arrow)"/>
        <line x1="666" y1="116" x2="702" y2="116" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gpu-stack-pod-chain-zh-podchain-arrow)"/>
        <line x1="786" y1="148" x2="786" y2="252" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gpu-stack-pod-chain-zh-podchain-arrow)"/>
        <line x1="702" y1="284" x2="666" y2="284" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gpu-stack-pod-chain-zh-podchain-arrow)"/>
        <line x1="498" y1="284" x2="462" y2="284" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gpu-stack-pod-chain-zh-podchain-arrow)"/>
        <line x1="294" y1="284" x2="258" y2="284" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gpu-stack-pod-chain-zh-podchain-arrow)"/>

        <!-- Row 1 -->
        <g>
          <rect x="90" y="84" width="168" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="98" y="90" width="36" height="12" rx="2" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.40"/>
          <text x="116" y="99" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">WORKLOAD</text>
          <text x="174" y="120" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">Pod</text>
          <text x="174" y="136" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">GPU 负载</text>
        </g>
        <g>
          <rect x="294" y="84" width="168" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="378" y="120" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">containerd</text>
          <text x="378" y="136" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">容器运行时</text>
        </g>
        <g>
          <rect x="498" y="84" width="168" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="506" y="90" width="52" height="12" rx="2" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.40"/>
          <text x="532" y="99" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">NVIDIA</text>
          <text x="582" y="120" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">Container Toolkit</text>
          <text x="582" y="136" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">向 OCI 注入 GPU</text>
        </g>
        <g>
          <rect x="702" y="84" width="168" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="786" y="120" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">CUDA</text>
          <text x="786" y="136" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">运行时 / 工具包</text>
        </g>

        <!-- Row 2 (flow right to left) -->
        <g>
          <rect x="702" y="252" width="168" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="786" y="288" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">驱动库</text>
          <text x="786" y="304" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">用户态</text>
        </g>
        <g>
          <rect x="498" y="252" width="168" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="506" y="258" width="44" height="12" rx="2" fill="none" stroke="#15324d" stroke-width="0.8" stroke-opacity="0.40"/>
          <text x="528" y="267" fill="#15324d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">KMOD</text>
          <text x="582" y="288" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">nvidia.ko</text>
          <text x="582" y="304" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">内核模块</text>
        </g>
        <g>
          <rect x="294" y="252" width="168" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="378" y="288" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">PCIe 总线</text>
          <text x="378" y="304" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">互连</text>
        </g>
        <g>
          <rect x="90" y="252" width="168" height="64" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <text x="174" y="288" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">NVIDIA GPU</text>
          <text x="174" y="304" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">硬件</text>
        </g>
      </svg>
