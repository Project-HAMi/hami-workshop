<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; color-scheme: dark;" version="1.1" width="961px" height="853px" viewBox="0 0 961 853"><g transform="translate(0.5,0.5)"><rect x="0" y="0" width="960" height="852" rx="18.0" ry="18.0" fill="#0B0F14" stroke="none"/><text x="24" y="44.8" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="19px" fill="#F0F6FD" text-anchor="start" font-weight="bold">Be the device plugin</text><text x="24" y="70.0" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="14px" fill="#9EB6CE" text-anchor="start">The process gets the same four things, from HAMi in a cluster or from you on Colab</text><rect x="24" y="96" width="444" height="156" rx="4.0" ry="4.0" fill="#171E27" stroke="#2A3442" stroke-width="1"/><text x="40" y="121.1" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="11.5px" fill="#9EB6CE" text-anchor="start" font-weight="bold">IN A CLUSTER</text><rect x="492" y="96" width="444" height="156" rx="4.0" ry="4.0" fill="#171E27" stroke="#2A3442" stroke-width="1"/><text x="508" y="121.1" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="11.5px" fill="#9EB6CE" text-anchor="start" font-weight="bold">ON COLAB</text><rect x="40" y="138" width="200" height="96" rx="4.0" ry="4.0" fill="#171E27" stroke="#2A3442" stroke-width="1"/><text x="140" y="172.4" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="15px" fill="#F0F6FD" text-anchor="middle" font-weight="bold">Pod</text><text x="140" y="192.8" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12px" fill="#9EB6CE" text-anchor="middle">nvidia.com/gpumem: 4096</text><text x="140" y="211.8" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12px" fill="#9EB6CE" text-anchor="middle">nvidia.com/gpucores: 30</text><rect x="276" y="138" width="176" height="96" rx="4.0" ry="4.0" fill="#171E27" stroke="#10D05D" stroke-width="2"/><text x="364" y="172.4" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="15px" fill="#35E37B" text-anchor="middle" font-weight="bold">HAMi device plugin</text><text x="364" y="193.2" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="middle">sets the env vars</text><text x="364" y="212.2" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="middle">and ld.so.preload</text><rect x="508" y="138" width="200" height="96" rx="4.0" ry="4.0" fill="#171E27" stroke="#2A3442" stroke-width="1"/><text x="608" y="172.4" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="15px" fill="#F0F6FD" text-anchor="middle" font-weight="bold">Your limits</text><text x="608" y="192.8" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12px" fill="#9EB6CE" text-anchor="middle">memory: 4096 MiB</text><text x="608" y="211.8" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12px" fill="#9EB6CE" text-anchor="middle">compute: 30%</text><rect x="744" y="138" width="176" height="96" rx="4.0" ry="4.0" fill="#171E27" stroke="#2A3442" stroke-width="1"/><text x="832" y="172.4" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="15px" fill="#F0F6FD" text-anchor="middle" font-weight="bold">You</text><text x="832" y="193.2" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="middle">type them into</text><text x="832" y="212.2" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="middle">a notebook cell</text><polyline points="240,186 267,186" fill="none" stroke="#8FD9F5" stroke-width="2" stroke-miterlimit="10"/><path d="M 276 186 L 267 190.5 L 267 181.5 Z" fill="#8FD9F5" stroke="none"/><polyline points="708,186 735,186" fill="none" stroke="#8FD9F5" stroke-width="2" stroke-miterlimit="10"/><path d="M 744 186 L 735 190.5 L 735 181.5 Z" fill="#8FD9F5" stroke="none"/><polyline points="364,252 364,291" fill="none" stroke="#8FD9F5" stroke-width="2" stroke-miterlimit="10"/><path d="M 364 300 L 359.5 291 L 368.5 291 Z" fill="#8FD9F5" stroke="none"/><text x="374" y="279.3" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12px" fill="#9EB6CE" text-anchor="start">env + /etc/ld.so.preload</text><polyline points="832,252 832,291" fill="none" stroke="#8FD9F5" stroke-width="2" stroke-miterlimit="10"/><path d="M 832 300 L 827.5 291 L 836.5 291 Z" fill="#8FD9F5" stroke="none"/><text x="822" y="279.3" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12px" fill="#9EB6CE" text-anchor="end">env + LD_PRELOAD</text><rect x="24" y="300" width="912" height="140" rx="4.0" ry="4.0" fill="#171E27" stroke="#2A3442" stroke-width="1"/><text x="40" y="325.1" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="11.5px" fill="#9EB6CE" text-anchor="start" font-weight="bold">WHAT EVERY PROCESS GETS</text><text x="44" y="351.5" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12.5px" fill="#F0F6FD" text-anchor="start" font-weight="bold">CUDA_DEVICE_MEMORY_LIMIT_0=4096m</text><text x="44" y="372.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="start">memory limit</text><text x="44" y="401.5" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12.5px" fill="#F0F6FD" text-anchor="start" font-weight="bold">CUDA_DEVICE_SM_LIMIT=30</text><text x="44" y="422.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="start">compute limit, % of the GPU</text><text x="504" y="351.5" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12.5px" fill="#F0F6FD" text-anchor="start" font-weight="bold">CUDA_DEVICE_MEMORY_SHARED_CACHE</text><text x="504" y="372.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="start">one file per container</text><text x="504" y="401.5" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12.5px" fill="#F0F6FD" text-anchor="start" font-weight="bold">libvgpu.so, preloaded</text><text x="504" y="422.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="start">loaded before CUDA</text><polyline points="480,440 480,471" fill="none" stroke="#8FD9F5" stroke-width="2" stroke-miterlimit="10"/><path d="M 480 480 L 475.5 471 L 484.5 471 Z" fill="#8FD9F5" stroke="none"/><rect x="330" y="480" width="300" height="56" rx="4.0" ry="4.0" fill="#171E27" stroke="#2A3442" stroke-width="1"/><text x="480" y="503.9" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="15px" fill="#F0F6FD" text-anchor="middle" font-weight="bold">Your program</text><text x="480" y="524.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="middle">model.py · greedy.py · bench.py</text><polyline points="480,536 480,561" fill="none" stroke="#8FD9F5" stroke-width="2" stroke-miterlimit="10"/><path d="M 480 570 L 475.5 561 L 484.5 561 Z" fill="#8FD9F5" stroke="none"/><text x="492" y="555.3" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12px" fill="#9EB6CE" text-anchor="start">cudaMalloc · kernel launches</text><rect x="330" y="570" width="300" height="64" rx="4.0" ry="4.0" fill="#171E27" stroke="#10D05D" stroke-width="2"/><text x="480" y="597.9" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="15px" fill="#35E37B" text-anchor="middle" font-weight="bold">libvgpu.so</text><text x="480" y="618.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="middle">HAMi-core, between program and driver</text><polyline points="480,634 480,659" fill="none" stroke="#8FD9F5" stroke-width="2" stroke-miterlimit="10"/><path d="M 480 668 L 475.5 659 L 484.5 659 Z" fill="#8FD9F5" stroke="none"/><text x="492" y="655.3" font-family="&apos;IBM Plex Mono&apos;,&apos;SFMono-Regular&apos;,Consolas,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,monospace" font-size="12px" fill="#9EB6CE" text-anchor="start">only what fits the limits</text><rect x="330" y="668" width="300" height="52" rx="4.0" ry="4.0" fill="#171E27" stroke="#2A3442" stroke-width="1"/><text x="480" y="689.9" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="15px" fill="#F0F6FD" text-anchor="middle" font-weight="bold">CUDA driver</text><text x="480" y="710.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="middle">libcuda.so · NVML</text><polyline points="480,720 480,735" fill="none" stroke="#8FD9F5" stroke-width="2" stroke-miterlimit="10"/><path d="M 480 744 L 475.5 735 L 484.5 735 Z" fill="#8FD9F5" stroke="none"/><rect x="330" y="744" width="300" height="52" rx="4.0" ry="4.0" fill="#171E27" stroke="#2A3442" stroke-width="1"/><text x="480" y="765.9" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="15px" fill="#F0F6FD" text-anchor="middle" font-weight="bold">Tesla T4</text><text x="480" y="786.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="middle">15360 MiB · one card, not split</text><rect x="24" y="556" width="276" height="92" rx="4.0" ry="4.0" fill="#0B0F14" stroke="#2A3442" stroke-width="1"/><text x="40" y="584.0" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="14px" fill="#F0F6FD" text-anchor="start" font-weight="bold">Memory</text><text x="40" y="608.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="start">Refuses allocations over 4096 MiB</text><text x="40" y="628.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="start">and reports 4096 MiB as the total</text><line x1="330" y1="602" x2="300" y2="602" stroke="#35E37B" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="660" y="556" width="276" height="92" rx="4.0" ry="4.0" fill="#0B0F14" stroke="#2A3442" stroke-width="1"/><text x="676" y="584.0" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="14px" fill="#F0F6FD" text-anchor="start" font-weight="bold">Compute</text><text x="676" y="608.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="start">Holds back kernel launches so</text><text x="676" y="628.7" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="13px" fill="#9EB6CE" text-anchor="start">utilization averages out at 30%</text><line x1="630" y1="602" x2="660" y2="602" stroke="#35E37B" stroke-width="1.5" stroke-dasharray="6 4"/><text x="480" y="825.0" font-family="&apos;Source Sans 3&apos;,&apos;Noto Sans&apos;,&apos;Segoe UI&apos;,&apos;PingFang SC&apos;,&apos;Noto Sans CJK SC&apos;,&apos;Microsoft YaHei&apos;,sans-serif" font-size="14px" fill="#9EB6CE" text-anchor="middle" font-style="italic">The host still sees one whole card. The limits live in a library inside each process.</text></g></svg>
