<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-title seq-desc" id="hami-arch-inference-seq-root">
        <title id="seq-title">Inference Pod, cross-layer flow</title>
        <desc id="seq-desc">A user-submitted Pod requesting 2GB VRAM is scheduled by kube-scheduler with the hami-scheduler extender, then kubelet has the hami-device-plugin slice VRAM and mount the device before the container starts.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #hami-arch-inference-seq-root { font-family: 'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif; }
      #hami-arch-inference-seq-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#hami-arch-inference-seq-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="hami-arch-inference-seq-seq-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="hami-arch-inference-seq-seq-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="hami-arch-inference-seq-seq-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
          <marker id="hami-arch-inference-seq-seq-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#5a748f" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Annotation callout: the submitter -->
        <text x="64" y="104" fill="#15324d" font-size="13" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" font-style="italic" fill-opacity="0.75">user submits a Pod requesting 2GB of VRAM</text>

        <!-- Lifelines -->
        <line x1="180" y1="88" x2="180" y2="592" stroke="#15324d" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="360" y1="88" x2="360" y2="592" stroke="#15324d" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="540" y1="88" x2="540" y2="592" stroke="#15324d" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="720" y1="88" x2="720" y2="592" stroke="#15324d" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="900" y1="88" x2="900" y2="592" stroke="#15324d" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- Activation bars -->
        <rect x="176" y="120" width="8" height="192" fill="#15324d" stroke="#5a748f" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="356" y="164" width="8" height="144" fill="#15324d" stroke="#5a748f" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="536" y="164" width="8" height="96" fill="#15324d" stroke="#5a748f" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="716" y="340" width="8" height="212" fill="#15324d" stroke="#5a748f" stroke-width="0.8" fill-opacity="0.06"/>
        <rect x="896" y="384" width="8" height="96" fill="#15324d" stroke="#5a748f" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- Messages -->
        <line x1="184" y1="132" x2="352" y2="132" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-inference-seq-seq-arrow)"/>
        <rect x="216" y="110" width="104" height="12" rx="2" fill="#f5f8fb"/>
        <text x="268" y="119" fill="#15324d" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" fill-opacity="0.55">trigger scheduling</text>

        <line x1="368" y1="176" x2="532" y2="176" stroke="#7c8cff" stroke-width="1.2" marker-end="url(#hami-arch-inference-seq-seq-arrow-link)"/>
        <rect x="404" y="154" width="92" height="12" rx="2" fill="#f5f8fb"/>
        <text x="450" y="163" fill="#15324d" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" fill-opacity="0.55">call extender</text>

        <!-- HS self message -->
        <path d="M 548,208 H 588 Q 596,208 596,216 V 232 Q 596,240 588,240 H 548"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-inference-seq-seq-arrow)"/>
        <text x="604" y="228" fill="#15324d" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" fill-opacity="0.55">pick best node</text>

        <!-- Return: recommended node (headline) -->
        <line x1="532" y1="264" x2="368" y2="264" stroke="#0a8f3d" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#hami-arch-inference-seq-seq-arrow-accent)"/>
        <rect x="400" y="242" width="100" height="12" rx="2" fill="#f5f8fb"/>
        <text x="450" y="251" fill="#15324d" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" fill-opacity="0.55">recommended node</text>

        <line x1="352" y1="308" x2="188" y2="308" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-inference-seq-seq-arrow)"/>
        <rect x="220" y="286" width="100" height="12" rx="2" fill="#f5f8fb"/>
        <text x="270" y="295" fill="#15324d" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" fill-opacity="0.55">bind pod to node</text>

        <!-- Async notify -->
        <line x1="188" y1="352" x2="712" y2="352" stroke="#5a748f" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#hami-arch-inference-seq-seq-arrow-open)"/>
        <rect x="396" y="330" width="108" height="12" rx="2" fill="#f5f8fb"/>
        <text x="450" y="339" fill="#15324d" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" fill-opacity="0.55">create Pod (async)</text>

        <line x1="728" y1="396" x2="892" y2="396" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-inference-seq-seq-arrow)"/>
        <rect x="748" y="374" width="124" height="12" rx="2" fill="#f5f8fb"/>
        <text x="810" y="383" fill="#15324d" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" fill-opacity="0.55">allocate GPU slice</text>

        <!-- HDP self message -->
        <path d="M 908,428 H 948 Q 956,428 956,436 V 452 Q 956,460 948,460 H 908"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-inference-seq-seq-arrow)"/>
        <text x="964" y="448" fill="#15324d" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" fill-opacity="0.55">slice + mount</text>

        <line x1="892" y1="480" x2="728" y2="480" stroke="#5a748f" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#hami-arch-inference-seq-seq-arrow)"/>
        <rect x="762" y="458" width="96" height="12" rx="2" fill="#f5f8fb"/>
        <text x="810" y="467" fill="#15324d" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" fill-opacity="0.55">allocation done</text>

        <!-- Kubelet self message -->
        <path d="M 728,512 H 768 Q 776,512 776,520 V 536 Q 776,544 768,544 H 728"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#hami-arch-inference-seq-seq-arrow)"/>
        <text x="784" y="532" fill="#15324d" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" fill-opacity="0.55">run container</text>

        <!-- Actors -->
        <g>
          <rect x="105" y="40" width="150" height="48" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="180" y="60" fill="#15324d" font-size="11.5" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">kube-apiserver</text>
          <text x="180" y="76" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">cluster state</text>
        </g>
        <g>
          <rect x="285" y="40" width="150" height="48" rx="6" fill="#ffffff" stroke="#7c8cff" stroke-width="1.2"/>
          <text x="360" y="60" fill="#15324d" font-size="11.5" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">kube-scheduler</text>
          <text x="360" y="76" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">filter + score</text>
        </g>
        <g>
          <rect x="465" y="40" width="150" height="48" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="473" y="46" width="36" height="12" rx="2" fill="#10d05d" stroke="#10d05d" stroke-width="0.8" fill-opacity="0.12" stroke-opacity="0.60"/>
          <text x="491" y="55" fill="#0a8f3d" font-size="7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HAMI</text>
          <text x="540" y="74" fill="#15324d" font-size="11.5" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">hami-scheduler</text>
        </g>
        <g>
          <rect x="645" y="40" width="150" height="48" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="720" y="60" fill="#15324d" font-size="11.5" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">kubelet</text>
          <text x="720" y="76" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">node agent</text>
        </g>
        <g>
          <rect x="825" y="40" width="150" height="48" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="833" y="46" width="36" height="12" rx="2" fill="#10d05d" stroke="#10d05d" stroke-width="0.8" fill-opacity="0.12" stroke-opacity="0.60"/>
          <text x="851" y="55" fill="#0a8f3d" font-size="7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">HAMI</text>
          <text x="900" y="74" fill="#15324d" font-size="11.5" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">hami-device-plugin</text>
        </g>
      </svg>
