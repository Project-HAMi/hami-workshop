<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deploy-zh-title deploy-zh-desc" id="containerdays-deployment-architecture-zh-root">
        <title id="deploy-zh-title">setup.sh 装了什么</title>
        <desc id="deploy-zh-desc">kube-system 里的两个 Helm release：HAMi 调度器 Deployment 及其 webhook、Service、TLS Secret、配置与 RBAC，加 mock 设备插件与 mock monitor，以及被注册容量的节点。</desc>
        <defs>
      <style>#containerdays-deployment-architecture-zh-root { font-family: 'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif; }
      #containerdays-deployment-architecture-zh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#containerdays-deployment-architecture-zh-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="containerdays-deployment-architecture-zh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="containerdays-deployment-architecture-zh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8a3c"/></marker>
          <marker id="containerdays-deployment-architecture-zh-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: kube-system -->
        <rect x="232" y="96" width="688" height="400" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="500" y="100" width="152" height="12" rx="2" fill="#f5f5f5"/>
        <text x="576" y="109" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">KUBE-SYSTEM · 2 HELM RELEASES</text>

        <!-- Arrows first -->
        <line x1="176" y1="176" x2="256" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-deployment-architecture-zh-arrow)"/>
        <line x1="424" y1="176" x2="456" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-deployment-architecture-zh-arrow)"/>
        <line x1="540" y1="208" x2="540" y2="264" stroke="#0a8a3c" stroke-width="1.4" marker-end="url(#containerdays-deployment-architecture-zh-arrow-accent)"/>
        <path d="M 700,208 V 240 H 664 Q 656,240 656,248 V 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-deployment-architecture-zh-arrow)"/>
        <line x1="424" y1="300" x2="456" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-deployment-architecture-zh-arrow)"/>
        <line x1="704" y1="440" x2="672" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-deployment-architecture-zh-arrow)"/>
        <path d="M 640,400 V 368 H 788 Q 796,368 796,356 V 336" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#containerdays-deployment-architecture-zh-arrow)"/>

        <!-- Arrow labels -->
        <rect x="184" y="156" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="212" y="167" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">准入</text>

        <rect x="700" y="348" width="48" height="14" rx="2" fill="#f5f5f5"/>
        <text x="724" y="359" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">用量</text>

        <!-- Node: GPU Pod (input, outside zone) -->
        <rect x="40" y="144" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="144" width="136" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="150" width="28" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="62" y="159" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
