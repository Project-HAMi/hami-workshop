        <text x="732" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">scheduler-tls</text>
        <text x="732" y="198" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">certgen hook 产物</text>

        <!-- Node: Config + RBAC -->
        <rect x="256" y="264" width="168" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="264" width="168" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="264" y="270" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="278" y="279" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CFG</text>
        <text x="340" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">配置与 RBAC</text>
        <text x="340" y="318" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">2 个 ConfigMap</text>
        <text x="340" y="332" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">SA + 9 个 RBAC 对象</text>

        <!-- Node: hami-scheduler Deployment (focal) -->
        <rect x="456" y="264" width="216" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="456" y="264" width="216" height="72" rx="6" fill="#10d05d" stroke="#0a8a3c" stroke-width="1" fill-opacity="0.10"/>
        <rect x="464" y="270" width="40" height="12" rx="2" fill="none" stroke="#0a8a3c" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="484" y="279" fill="#0a8a3c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEPLOY</text>
        <text x="564" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-scheduler ×1</text>
        <text x="564" y="318" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">kube-scheduler + 扩展器</text>
        <text x="564" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">projecthami/hami:v2.10.0</text>

        <!-- Node: hami-mock-monitor -->
        <rect x="704" y="264" width="184" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="264" width="184" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="712" y="270" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="726" y="279" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MON</text>
        <text x="796" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-mock-monitor</text>
        <text x="796" y="318" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">用量指标 :9394</text>
        <text x="796" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">completeBinds=true</text>

        <!-- Node: the worker node -->
        <rect x="256" y="400" width="416" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="400" width="416" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="264" y="406" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="280" y="415" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
        <text x="464" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-lab-control-plane</text>
        <text x="464" y="454" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">node-nvidia-register + 2 × A100-40GB（模拟）</text>
        <text x="464" y="470" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gpu=20 · gpumem=81920 · gpucores=200</text>

        <!-- Node: mock device plugin DS -->
        <rect x="704" y="400" width="184" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="400" width="184" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="712" y="406" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="724" y="415" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DS</text>
        <text x="796" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">mock-device-plugin</text>
        <text x="796" y="454" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">节点上的 DaemonSet</text>
        <text x="796" y="470" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">注册 gpumem · gpucores</text>

