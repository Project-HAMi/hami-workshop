        <rect x="570" y="548" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="590" y="558" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">输入</text>

        <line x1="650" y1="553" x2="678" y2="553" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#containerdays-deployment-architecture-zh-arrow)"/>
        <text x="686" y="558" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">指标</text>
