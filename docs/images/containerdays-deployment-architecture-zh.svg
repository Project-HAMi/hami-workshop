        <text x="108" y="198" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">碎片化请求</text>

        <!-- Node: MutatingWebhookConfiguration -->
        <rect x="256" y="144" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="144" width="168" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="264" y="150" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="280" y="159" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADM</text>
        <text x="340" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-webhook</text>
        <text x="340" y="198" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">改写 schedulerName</text>

        <!-- Node: Service -->
        <rect x="456" y="144" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="456" y="144" width="168" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="464" y="150" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
