        <text x="348" y="186" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">certgen 镜像</text>

        <rect x="648" y="132" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="132" width="200" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="656" y="138" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
