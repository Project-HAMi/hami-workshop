        <rect x="264" y="228" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="228" width="168" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="272" y="234" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="286" y="243" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
        <text x="348" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">admission-patch</text>
        <text x="348" y="282" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">跑一次即自删</text>

        <rect x="648" y="228" width="200" height="64" rx="6" fill="#f5f5f5"/>
