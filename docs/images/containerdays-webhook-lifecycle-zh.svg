        <line x1="496" y1="448" x2="448" y2="448" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#containerdays-webhook-lifecycle-zh-arrow)"/>

        <!-- Install row 1 -->
        <rect x="88" y="132" width="140" height="64" rx="6" fill="#f5f5f5"/>
