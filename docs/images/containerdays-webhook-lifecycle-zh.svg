        <text x="712" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">schedulerName=</text>
        <text x="712" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">hami-scheduler</text>
