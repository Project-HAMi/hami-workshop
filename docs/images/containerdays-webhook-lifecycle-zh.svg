<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wl-zh-title wl-zh-desc" id="containerdays-webhook-lifecycle-zh-root">
        <title id="wl-zh-title">hami-webhook 如何被注入、如何运转</title>
        <desc id="wl-zh-desc">安装期：helm hook 两个 Job 生成 TLS Secret 并把 caBundle patch 进 MutatingWebhookConfiguration；运行期：每次 Pod 创建按规则匹配后转发给扩展器，返回 schedulerName 补丁。</desc>
        <defs>
      <style>#containerdays-webhook-lifecycle-zh-root { font-family: 'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif; }
      #containerdays-webhook-lifecycle-zh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#containerdays-webhook-lifecycle-zh-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="containerdays-webhook-lifecycle-zh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="containerdays-webhook-lifecycle-zh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8a3c"/></marker>
          <marker id="containerdays-webhook-lifecycle-zh-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone 1: install time -->
        <rect x="64" y="96" width="832" height="232" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="368" y="100" width="224" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="109" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">INSTALL TIME · HELM HOOKS · ONCE</text>

        <!-- Zone 2: runtime -->
        <rect x="64" y="360" width="832" height="184" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="366" y="364" width="228" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="373" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.40">RUNTIME · EVERY POD CREATE</text>

        <!-- Arrows: install -->
        <line x1="228" y1="164" x2="264" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-webhook-lifecycle-zh-arrow)"/>
        <path d="M 158,196 V 260 H 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-webhook-lifecycle-zh-arrow)"/>
        <line x1="432" y1="164" x2="648" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-webhook-lifecycle-zh-arrow)"/>
        <rect x="490" y="144" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="540" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITES CERT</text>
        <line x1="432" y1="260" x2="648" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#containerdays-webhook-lifecycle-zh-arrow)"/>
