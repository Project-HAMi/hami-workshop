        <text x="748" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-webhook</text>
        <text x="748" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rules + caBundle</text>

        <!-- Runtime row -->
        <rect x="88" y="396" width="140" height="64" rx="6" fill="#f5f5f5"/>
