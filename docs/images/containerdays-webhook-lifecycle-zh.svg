        <text x="158" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hami 2.10.0</text>

        <rect x="264" y="132" width="168" height="64" rx="6" fill="#f5f5f5"/>
