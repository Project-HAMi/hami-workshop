        <text x="158" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">GPU Pod</text>
        <text x="158" y="450" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">创建</text>

        <rect x="264" y="396" width="184" height="64" rx="6" fill="#f5f5f5"/>
