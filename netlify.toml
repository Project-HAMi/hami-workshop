[build]
  command = "pip install -r requirements.txt && mkdocs build"
  publish = "site/"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/zh"
  to = "/zh/"
  status = 301
