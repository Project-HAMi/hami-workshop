<!DOCTYPE html>
<html lang="zh">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

<body>

        <rect x="488" y="358" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="504" y="367" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MON</text>

        <rect x="270" y="504" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

        <rect x="370" y="504" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>

        <line x1="620" y1="509" x2="648" y2="509" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="656" y="514" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">指标查询</text>
