<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annotation Data Bus · ContainerDays 2026 SG</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', 'Helvetica Neue', sans-serif; background: #f5f5f5;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="abus-title abus-desc">
        <title id="abus-title">HAMi's annotation data bus</title>
        <desc id="abus-desc">Node and Pod annotations are HAMi's database: the device plugin writes the card inventory and reads allocations, the scheduler extender reads the inventory and policies and writes allocations while holding the node mutex, and the user writes policy overrides.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8a3c"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows: left column (plugin, user) -->
        <path d="M 268,196 H 320 V 152 H 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="276" y="130" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGISTER</text>

        <line x1="268" y1="208" x2="368" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="274" y="190" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="318" y="199" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE LOCK</text>

        <line x1="268" y1="384" x2="368" y2="384" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="284" y="366" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="324" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TO-ALLOCATE</text>

        <line x1="268" y1="412" x2="368" y2="412" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="288" y="394" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="322" y="403" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOCATED</text>

        <line x1="268" y1="440" x2="368" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="292" y="422" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="322" y="431" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text>

        <path d="M 228,476 H 296 V 356 H 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="302" y="452" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="330" y="461" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POLICIES</text>

        <!-- Arrows: right column (extender) -->
        <path d="M 660,152 H 716 V 196 H 752" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="664" y="130" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="694" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGISTER</text>

        <line x1="752" y1="208" x2="660" y2="208" stroke="#0a8a3c" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="672" y="214" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="223" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TAKE LOCK</text>

        <line x1="752" y1="356" x2="660" y2="356" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="676" y="338" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="704" y="347" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POLICIES</text>

        <line x1="752" y1="384" x2="660" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="668" y="366" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="708" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TO-ALLOCATE</text>

        <line x1="752" y1="412" x2="660" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="672" y="394" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="403" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOCATED</text>

        <!-- Store panel: Node annotations -->
        <rect x="368" y="96" width="292" height="164" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="96" width="292" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="376" y="102" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="394" y="111" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
        <text x="514" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">hami-lab-control-plane</text>
        <line x1="384" y1="136" x2="644" y2="136" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="384" y="156" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">node-nvidia-register</text>
        <text x="384" y="168" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist', 'Helvetica Neue', sans-serif">card inventory: id, devmem, devcore, health, numa</text>
        <line x1="384" y1="180" x2="644" y2="180" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="384" y="196" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">node-handshake</text>
        <text x="384" y="208" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist', 'Helvetica Neue', sans-serif">liveness ping between plugin and scheduler</text>
        <line x1="384" y1="220" x2="644" y2="220" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="384" y="236" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">mutex.lock</text>
        <text x="384" y="248" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist', 'Helvetica Neue', sans-serif">bind mutex · plus status.capacity nvidia.com/*</text>

        <!-- Store panel: Pod annotations -->
        <rect x="368" y="300" width="292" height="200" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="300" width="292" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="376" y="306" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="392" y="315" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POD</text>
        <text x="514" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">share-1</text>
        <line x1="384" y1="340" x2="644" y2="340" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="384" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">gpu/node-scheduler-policy</text>
        <text x="384" y="372" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist', 'Helvetica Neue', sans-serif">binpack | spread, per node and per card</text>
        <line x1="384" y1="384" x2="644" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="384" y="400" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">vgpu-devices-to-allocate</text>
        <text x="384" y="412" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist', 'Helvetica Neue', sans-serif">pending allocation written before Allocate</text>
        <line x1="384" y1="424" x2="644" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="384" y="440" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">vgpu-devices-allocated</text>
        <text x="384" y="452" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist', 'Helvetica Neue', sans-serif">uuid,type,mem,cores per container</text>
        <line x1="384" y1="464" x2="644" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="384" y="480" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">bind-phase</text>
        <text x="384" y="492" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist', 'Helvetica Neue', sans-serif">allocating → success releases the mutex</text>

        <!-- Actor: device plugin -->
        <rect x="64" y="180" width="204" height="240" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="180" width="204" height="240" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="186" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="88" y="195" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLUG</text>
        <text x="166" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">HAMi device plugin</text>
        <text x="166" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DaemonSet on the node</text>
        <text x="166" y="262" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">reads NVML on real cards</text>
        <text x="166" y="278" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">registers inventory once,</text>
        <text x="166" y="294" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">then serves Allocate:</text>
        <text x="166" y="310" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">mount devices, inject</text>
        <text x="166" y="326" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">libvgpu.so, mark success</text>
        <text x="166" y="354" fill="rgba(45,49,66,0.55)" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">in this lab the mock plugin</text>
        <text x="166" y="370" fill="rgba(45,49,66,0.55)" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">skips Allocate; hami-mock-</text>
        <text x="166" y="386" fill="rgba(45,49,66,0.55)" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">monitor stands in via</text>
        <text x="166" y="402" fill="rgba(45,49,66,0.55)" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">completeBinds=true</text>

        <!-- Actor: scheduler extender (focal) -->
        <rect x="752" y="180" width="168" height="240" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="180" width="168" height="240" rx="6" fill="rgba(16,208,93,0.10)" stroke="#0a8a3c" stroke-width="1"/>
        <rect x="760" y="186" width="32" height="12" rx="2" fill="transparent" stroke="rgba(10,138,60,0.50)" stroke-width="0.8"/>
        <text x="776" y="195" fill="#0a8a3c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="836" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">scheduler</text>
        <text x="836" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">extender</text>
        <text x="836" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Filter · Bind</text>
        <text x="836" y="282" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">Filter: reads inventory</text>
        <text x="836" y="298" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">+ policies, checks each</text>
        <text x="836" y="314" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">card, scores binpack or</text>
        <text x="836" y="330" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">spread</text>
        <text x="836" y="358" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">Bind: takes the node</text>
        <text x="836" y="374" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">mutex, writes the</text>
        <text x="836" y="390" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">allocation, waits for</text>
        <text x="836" y="406" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">success to release</text>

        <!-- Actor: user -->
        <rect x="64" y="452" width="164" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="452" width="164" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="72" y="458" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="86" y="467" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
        <text x="146" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Helvetica Neue', sans-serif" text-anchor="middle">User / YAML</text>
        <text x="146" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kubectl apply -f share.yaml</text>

        <!-- Legend -->
        <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <line x1="120" y1="544" x2="148" y2="544" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="156" y="547" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">write</text>
        <line x1="220" y1="544" x2="248" y2="544" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="256" y="547" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">read</text>
        <line x1="320" y1="544" x2="348" y2="544" stroke="#0a8a3c" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="356" y="547" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">the mutex handshake</text>
        <rect x="500" y="538" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="520" y="547" fill="#4f5d75" font-size="8.5" font-family="'Geist', 'Helvetica Neue', sans-serif">annotation store: Node object / Pod object via kube-apiserver</text>
      </svg>
    </div>
  </div>
</body>
</html>
