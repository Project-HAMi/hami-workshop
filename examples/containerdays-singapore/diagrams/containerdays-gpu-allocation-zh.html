<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每卡 GPU 分配 · ContainerDays 2026 SG</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif; background: #f5f5f5;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gpu-zh-title gpu-zh-desc">
        <title id="gpu-zh-title">每张卡的 GPU 分配</title>
        <desc id="gpu-zh-desc">实验节点上的每卡显存分配：每张模拟 A100-40GB 展示预留显存与容量的对比，以及持有预留的 Pod。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8a3c"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Node header band -->
        <text x="64" y="80" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif">hami-lab-control-plane</text>
        <text x="896" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">slots 3/20 · cores 90/200 · gpumem 45000/81920 MB</text>
        <line x1="64" y1="96" x2="896" y2="96" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <!-- Card 1: GPU-mock-0 -->
        <rect x="64" y="136" width="184" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="136" width="184" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="142" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="88" y="151" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CARD</text>
        <text x="156" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">GPU-mock-0</text>
        <text x="156" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">A100-SXM4-40GB</text>
        <text x="156" y="212" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">numa 0 · 健康</text>

        <text x="280" y="154" fill="#0a8a3c" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">已用 15000 MB</text>
        <text x="800" y="154" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="end">剩余 25960 MB</text>
        <rect x="280" y="164" width="520" height="28" rx="4" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
        <rect x="280" y="164" width="192" height="28" rx="4" fill="rgba(16,208,93,0.55)" stroke="#0a8a3c" stroke-width="1"/>
        <text x="480" y="214" fill="rgba(45,49,66,0.40)" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">容量 40960 MB</text>

        <text x="824" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif">share-2</text>
        <text x="824" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">15000 MB · 30%</text>

        <!-- Card 2: GPU-mock-1 -->
        <rect x="64" y="296" width="184" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="296" width="184" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="302" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="88" y="311" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CARD</text>
        <text x="156" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">GPU-mock-1</text>
        <text x="156" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">A100-SXM4-40GB</text>
        <text x="156" y="372" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif" text-anchor="middle">numa 0 · 健康</text>

        <text x="280" y="314" fill="#0a8a3c" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">已用 30000 MB</text>
        <text x="800" y="314" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="end">剩余 10960 MB</text>
        <rect x="280" y="324" width="520" height="28" rx="4" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
        <rect x="280" y="324" width="380" height="28" rx="4" fill="rgba(16,208,93,0.55)" stroke="#0a8a3c" stroke-width="1"/>
        <text x="480" y="374" fill="rgba(45,49,66,0.40)" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif" text-anchor="middle">容量 40960 MB</text>

        <text x="824" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif">share-1</text>
        <text x="824" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">15000 MB · 30%</text>
        <text x="824" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif">share-3</text>
        <text x="824" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">15000 MB · 30%</text>

        <!-- Bottom note -->
        <line x1="64" y1="456" x2="896" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="64" y="478" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">怎么读这张图</text>
        <text x="64" y="500" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif">每卡视图 = 节点注解 hami.io/node-nvidia-register（容量）与各 Pod 的 hami.io/vgpu-devices-allocated（预留）做 join。</text>
        <text x="64" y="518" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif">一张卡完全空闲 = 没有 Pod 引用它的 UUID。本例两卡都有预留，空闲整卡 0 张，但 GPU-mock-1 还塞得下 10000 MB 的请求。</text>
        <text x="64" y="536" fill="rgba(45,49,66,0.40)" font-size="12" font-family="'Geist', 'PingFang SC', 'Helvetica Neue', sans-serif">快照 2026-10-25 · 来自 share.yaml 的 share-1..3</text>
      </svg>
    </div>
  </div>
</body>
</html>
