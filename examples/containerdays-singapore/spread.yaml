# Lab 3: per-Pod GPU policy. One Pod per card, the opposite of binpack.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: spread-1
  annotations:
    hami.io/gpu-scheduler-policy: spread
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "86400"]
    resources:
      limits:
        nvidia.com/gpu: 1
        nvidia.com/gpumem: 15000
        nvidia.com/gpucores: 30
---
