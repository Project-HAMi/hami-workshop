# Lab 2: three Pods, each asking for 15000 MB and 30% of one GPU.
apiVersion: v1
kind: Pod
metadata:
  name: share-1
  annotations:
    hami-mock-monitor.io/load-source: seed
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "86400"]
    resources:
      limits:
        nvidia.com/gpu: 1
        nvidia.com/gpumem: 15000
        nvidia.com/gpucores: 30
---
