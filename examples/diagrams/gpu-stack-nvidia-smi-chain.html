<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nvidia-smi Call Chain</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif; background: #f5f8fb;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 720px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nsmi-title nsmi-desc" id="nsmi-root">
        <title id="nsmi-title">nvidia-smi call chain</title>
        <desc id="nsmi-desc">nvidia-smi queries through the NVML interface and libnvidia-ml.so into the nvidia.ko kernel module, which reads the GPU.</desc>
        <defs>
          <marker id="nsmi-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="nsmi-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="nsmi-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Arrows first -->
        <line x1="206" y1="125" x2="262" y2="125" stroke="#5a748f" stroke-width="1.2" marker-end="url(#nsmi-arrow)"/>
        <line x1="418" y1="125" x2="474" y2="125" stroke="#5a748f" stroke-width="1.2" marker-end="url(#nsmi-arrow)"/>
        <line x1="630" y1="125" x2="686" y2="125" stroke="#5a748f" stroke-width="1.2" marker-end="url(#nsmi-arrow)"/>
        <line x1="806" y1="125" x2="862" y2="125" stroke="#5a748f" stroke-width="1.2" marker-end="url(#nsmi-arrow)"/>

        <!-- Nodes -->
        <g>
          <rect x="56" y="89" width="150" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="64" y="95" width="36" height="12" rx="2" fill="transparent" stroke="rgba(21,50,77,0.40)" stroke-width="0.8"/>
          <text x="82" y="104" fill="rgba(21,50,77,0.80)" font-size="7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
          <text x="131" y="126" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">nvidia-smi</text>
          <text x="131" y="144" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">management CLI</text>
        </g>
        <g>
          <rect x="262" y="89" width="156" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="270" y="95" width="40" height="12" rx="2" fill="transparent" stroke="rgba(21,50,77,0.40)" stroke-width="0.8"/>
          <text x="290" y="104" fill="rgba(21,50,77,0.80)" font-size="7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
          <text x="340" y="126" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">NVML</text>
          <text x="340" y="144" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">C interface</text>
        </g>
        <g>
          <rect x="474" y="89" width="156" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="482" y="95" width="36" height="12" rx="2" fill="transparent" stroke="rgba(21,50,77,0.40)" stroke-width="0.8"/>
          <text x="500" y="104" fill="rgba(21,50,77,0.80)" font-size="7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
          <text x="552" y="126" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">libnvidia-ml.so</text>
          <text x="552" y="144" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">user space</text>
        </g>
        <g>
          <rect x="686" y="89" width="120" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="694" y="95" width="44" height="12" rx="2" fill="transparent" stroke="rgba(21,50,77,0.40)" stroke-width="0.8"/>
          <text x="716" y="104" fill="rgba(21,50,77,0.80)" font-size="7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">KMOD</text>
          <text x="746" y="126" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">nvidia.ko</text>
          <text x="746" y="144" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">kernel</text>
        </g>
        <g>
          <rect x="862" y="89" width="64" height="72" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <text x="894" y="122" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans', 'Segoe UI', sans-serif" text-anchor="middle">GPU</text>
          <text x="894" y="140" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">hw</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
