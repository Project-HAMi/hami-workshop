<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理工具调用链</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; background: #f5f8fb;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 720px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fanin-title fanin-desc" id="fanin-root">
        <title id="fanin-title">管理工具调用链</title>
        <desc id="fanin-desc">nvidia-smi、DCGM 和 Kubernetes device plugin 汇入 NVML，经 libnvidia-ml.so 与 nvidia.ko 到达 GPU。</desc>
        <defs>
          <marker id="fanin-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="fanin-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="fanin-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Arrows first (fan-in to NVML, then chain right and down) -->
        <path d="M 288,88 H 392 Q 400,88 400,96 V 147 Q 400,155 408,155 H 420"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#fanin-arrow)"/>
        <line x1="288" y1="200" x2="420" y2="200" stroke="#5a748f" stroke-width="1.2" marker-end="url(#fanin-arrow)"/>
        <path d="M 288,312 H 392 Q 400,312 400,304 V 253 Q 400,245 408,245 H 420"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#fanin-arrow)"/>
        <line x1="596" y1="200" x2="640" y2="200" stroke="#5a748f" stroke-width="1.2" marker-end="url(#fanin-arrow)"/>
        <path d="M 780,200 H 812 Q 820,200 820,192 V 160 Q 820,152 828,152 H 836"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#fanin-arrow)"/>
        <line x1="872" y1="184" x2="872" y2="248" stroke="#5a748f" stroke-width="1.2" marker-end="url(#fanin-arrow)"/>

        <!-- Callers -->
        <g>
          <rect x="72" y="56" width="216" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="80" y="62" width="36" height="12" rx="2" fill="transparent" stroke="rgba(21,50,77,0.40)" stroke-width="0.8"/>
          <text x="98" y="71" fill="rgba(21,50,77,0.80)" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
          <text x="180" y="92" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">nvidia-smi</text>
          <text x="180" y="108" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">管理工具</text>
        </g>
        <g>
          <rect x="72" y="168" width="216" height="64" rx="6" fill="#ffffff" stroke="#39c6f4" stroke-width="1.2"/>
          <rect x="80" y="174" width="48" height="12" rx="2" fill="transparent" stroke="rgba(21,50,77,0.40)" stroke-width="0.8"/>
          <text x="104" y="183" fill="rgba(21,50,77,0.80)" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">TELEMETRY</text>
          <text x="180" y="204" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">DCGM</text>
          <text x="180" y="220" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">GPU 诊断</text>
        </g>
        <g>
          <rect x="72" y="280" width="216" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="80" y="286" width="40" height="12" rx="2" fill="transparent" stroke="rgba(21,50,77,0.40)" stroke-width="0.8"/>
          <text x="100" y="295" fill="rgba(21,50,77,0.80)" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
          <text x="180" y="316" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">Device Plugin</text>
          <text x="180" y="332" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">kubelet 插件</text>
        </g>

        <!-- NVML hub (tall, three attach points) -->
        <g>
          <rect x="420" y="110" width="176" height="180" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <rect x="428" y="116" width="40" height="12" rx="2" fill="rgba(16,208,93,0.12)" stroke="rgba(16,208,93,0.60)" stroke-width="0.8"/>
          <text x="448" y="125" fill="#0a8f3d" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
          <text x="508" y="196" fill="#15324d" font-size="13" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">NVML</text>
          <text x="508" y="212" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">管理接口</text>
        </g>

        <!-- Library -->
        <g>
          <rect x="640" y="168" width="140" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="648" y="174" width="36" height="12" rx="2" fill="transparent" stroke="rgba(21,50,77,0.40)" stroke-width="0.8"/>
          <text x="666" y="183" fill="rgba(21,50,77,0.80)" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
          <text x="710" y="204" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">libnvidia-ml.so</text>
          <text x="710" y="220" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">用户态库</text>
        </g>

        <!-- Kernel module + GPU column -->
        <g>
          <rect x="836" y="120" width="72" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="872" y="148" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">nvidia.ko</text>
          <text x="872" y="164" fill="#5a748f" font-size="8" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">内核</text>
        </g>
        <g>
          <rect x="836" y="248" width="72" height="64" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="872" y="276" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">GPU</text>
          <text x="872" y="292" fill="#5a748f" font-size="8" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">硬件</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
