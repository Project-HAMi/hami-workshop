<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAMi 安装全景图</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; background: #f5f8fb;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 720px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oinst-title oinst-desc" id="oinst-root">
        <title id="oinst-title">HAMi 安装，六步</title>
        <desc id="oinst-desc">创建 GCP 虚拟机、安装 Helm、安装 Kubernetes、安装 Prometheus、安装 GPU Operator、最后安装 HAMi。</desc>
        <defs>
          <marker id="oinst-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="oinst-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="oinst-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Arrows first -->
        <line x1="360" y1="100" x2="396" y2="100" stroke="#5a748f" stroke-width="1.2" marker-end="url(#oinst-arrow)"/>
        <line x1="564" y1="100" x2="600" y2="100" stroke="#5a748f" stroke-width="1.2" marker-end="url(#oinst-arrow)"/>
        <path d="M 684,136 V 172 Q 684,180 676,180 H 168 Q 160,180 160,188 V 240 Q 160,248 168,248 H 192"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#oinst-arrow)"/>
        <line x1="360" y1="252" x2="396" y2="252" stroke="#5a748f" stroke-width="1.2" marker-end="url(#oinst-arrow)"/>
        <line x1="564" y1="252" x2="600" y2="252" stroke="#5a748f" stroke-width="1.2" marker-end="url(#oinst-arrow)"/>

        <!-- Row 1 -->
        <g>
          <rect x="192" y="64" width="168" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="200" y="70" width="20" height="14" rx="2" fill="rgba(21,50,77,0.10)"/>
          <text x="210" y="81" fill="#15324d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">1</text>
          <text x="276" y="102" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">创建 GCP 虚拟机</text>
          <text x="276" y="118" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">GPU 实例</text>
        </g>
        <g>
          <rect x="396" y="64" width="168" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="404" y="70" width="20" height="14" rx="2" fill="rgba(21,50,77,0.10)"/>
          <text x="414" y="81" fill="#15324d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">2</text>
          <text x="480" y="102" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">安装 Helm</text>
          <text x="480" y="118" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">包管理器</text>
        </g>
        <g>
          <rect x="600" y="64" width="168" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="608" y="70" width="20" height="14" rx="2" fill="rgba(21,50,77,0.10)"/>
          <text x="618" y="81" fill="#15324d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">3</text>
          <text x="684" y="102" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">安装 Kubernetes</text>
          <text x="684" y="118" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">kubeadm 集群</text>
        </g>

        <!-- Row 2 -->
        <g>
          <rect x="192" y="216" width="168" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="200" y="222" width="20" height="14" rx="2" fill="rgba(21,50,77,0.10)"/>
          <text x="210" y="233" fill="#15324d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">4</text>
          <text x="276" y="254" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">安装 Prometheus</text>
          <text x="276" y="270" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">监控栈</text>
        </g>
        <g>
          <rect x="396" y="216" width="168" height="72" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="404" y="222" width="20" height="14" rx="2" fill="rgba(21,50,77,0.10)"/>
          <text x="414" y="233" fill="#15324d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">5</text>
          <text x="480" y="254" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">安装 GPU Operator</text>
          <text x="480" y="270" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">驱动 + 工具包</text>
        </g>
        <g>
          <rect x="600" y="216" width="168" height="72" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <rect x="608" y="222" width="20" height="14" rx="2" fill="rgba(16,208,93,0.14)"/>
          <text x="618" y="233" fill="#0a8f3d" font-size="9" font-weight="600" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">6</text>
          <text x="684" y="254" fill="#15324d" font-size="11" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">安装 HAMi</text>
          <text x="684" y="270" fill="#5a748f" font-size="8.5" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">GPU 调度</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
