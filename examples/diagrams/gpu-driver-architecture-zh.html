<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux GPU 驱动架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif; background: #f5f8fb;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 720px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gda-title gda-desc" id="gda-root">
        <title id="gda-title">Linux GPU 驱动架构</title>
        <desc id="gda-desc">CLI 工具调用用户态 NVML 库，穿越内核态 nvidia.ko 模块，最终到达 GPU 设备。</desc>
        <defs>
          <marker id="gda-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a748f"/></marker>
          <marker id="gda-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0a8f3d"/></marker>
          <marker id="gda-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7c8cff"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f8fb"/>

        <!-- Zones (drawn first) -->
        <rect x="140" y="40" width="680" height="140" rx="8"
              fill="rgba(21,50,77,0.02)" stroke="rgba(21,50,77,0.10)" stroke-width="0.8"/>
        <rect x="408" y="34" width="144" height="12" rx="2" fill="#f5f8fb"/>
        <text x="480" y="43" fill="rgba(21,50,77,0.40)" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.14em">用户态</text>

        <rect x="140" y="220" width="680" height="120" rx="8"
              fill="rgba(21,50,77,0.02)" stroke="rgba(21,50,77,0.10)" stroke-width="0.8"/>
        <rect x="402" y="214" width="156" height="12" rx="2" fill="#f5f8fb"/>
        <text x="480" y="223" fill="rgba(21,50,77,0.40)" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.14em">内核态</text>

        <rect x="140" y="380" width="680" height="120" rx="8"
              fill="rgba(21,50,77,0.02)" stroke="rgba(21,50,77,0.10)" stroke-width="0.8"/>
        <rect x="414" y="374" width="132" height="12" rx="2" fill="#f5f8fb"/>
        <text x="480" y="383" fill="rgba(21,50,77,0.40)" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace"
              text-anchor="middle" letter-spacing="0.14em">硬件</text>

        <!-- Arrows first -->
        <line x1="430" y1="110" x2="530" y2="110" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gda-arrow)"/>
        <path d="M 640,138 V 184 Q 640,192 632,192 H 488 Q 480,192 480,200 V 252"
              fill="none" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gda-arrow)"/>
        <line x1="480" y1="308" x2="480" y2="412" stroke="#5a748f" stroke-width="1.2" marker-end="url(#gda-arrow)"/>

        <!-- Nodes -->
        <g>
          <rect x="210" y="82" width="220" height="56" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="320" y="106" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">nvidia-smi</text>
          <text x="320" y="122" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">CLI 工具</text>
        </g>
        <g>
          <rect x="530" y="82" width="220" height="56" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <text x="640" y="106" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">libnvidia-ml.so</text>
          <text x="640" y="122" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">用户态库</text>
        </g>
        <g>
          <rect x="370" y="252" width="220" height="56" rx="6" fill="#ffffff" stroke="#d5dee8" stroke-width="1"/>
          <rect x="378" y="258" width="48" height="12" rx="2" fill="transparent" stroke="rgba(21,50,77,0.40)" stroke-width="0.8"/>
          <text x="402" y="267" fill="rgba(21,50,77,0.80)" font-size="7" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">KMOD</text>
          <text x="480" y="286" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">nvidia.ko</text>
          <text x="480" y="302" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">内核模块</text>
        </g>
        <g>
          <rect x="370" y="412" width="220" height="56" rx="6" fill="#ffffff" stroke="#10d05d" stroke-width="1.4"/>
          <text x="480" y="436" fill="#15324d" font-size="12" font-weight="600" font-family="'Source Sans 3', 'Noto Sans SC', 'PingFang SC', 'Segoe UI', sans-serif" text-anchor="middle">GPU device</text>
          <text x="480" y="452" fill="#5a748f" font-size="9" font-family="'IBM Plex Mono', 'PingFang SC', 'SFMono-Regular', Consolas, monospace" text-anchor="middle">PCI 硬件</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
