# Lab 3: mutex. Only a card with no workload on it is a candidate.
apiVersion: v1
kind: Pod
metadata:
  name: mutex-1
  annotations:
    hami.io/gpu-scheduler-policy: mutex
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "86400"]
    resources:
      limits:
        nvidia.com/gpu: 1
        nvidia.com/gpumem: 15000
        nvidia.com/gpucores: 30
