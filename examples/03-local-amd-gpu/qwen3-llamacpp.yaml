# Two llama-server replicas of Qwen3-0.6B sharing one AMD GPU through HAMi.
# llama-server, its ROCm libraries and the model come from a payload image mounted
# as a read-only image volume (ImageVolume, enabled in the kind v1.36 node). Rebuild it with llama-build-job.yaml
# and Dockerfile.llama.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-llamacpp
  labels:
    app: qwen3-llamacpp
spec:
  replicas: 2
  # The two replicas hold all CUs, so a rolling update has no room for a surge pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-llamacpp
  template:
    metadata:
      labels:
        app: qwen3-llamacpp
    spec:
      volumes:
      - name: llama
        image:
          reference: ghcr.io/fishing-agents/hami-workshop:qwen3-0.6b-llamacpp-v0.7.0-rocm7.2.4
          pullPolicy: IfNotPresent
      containers:
      - name: llama
        image: rocm/dev-ubuntu-24.04:7.2.4
        command: ["/opt/llama/bin/llama-server"]
        args: ["--model", "/opt/llama/models/Qwen3-0.6B-Q8_0.gguf",
               "--host", "0.0.0.0", "--port", "8080",
               "--n-gpu-layers", "99", "--ctx-size", "2048"]
        env:
        # gfx1103 (Radeon 780M) is not on ROCm's list; run it as gfx1100.
        - name: HSA_OVERRIDE_GFX_VERSION
          value: "11.0.0"
        - name: LD_LIBRARY_PATH
          value: /opt/llama/lib
        - name: ROCBLAS_TENSILE_LIBPATH
          value: /opt/llama/lib/rocblas/library
        - name: HIPBLASLT_TENSILE_LIBPATH
          value: /opt/llama/lib/hipblaslt/library
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            amd.com/gpu: 1
            amd.com/gpucores: 50
            amd.com/gpumem: 2048
        volumeMounts:
        - name: llama
          mountPath: /opt/llama
          readOnly: true
