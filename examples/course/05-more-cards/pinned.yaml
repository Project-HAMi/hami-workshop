apiVersion: v1
kind: Pod
metadata:
  name: pinned
  annotations:
    nvidia.com/use-gpuuuid: "GPU-mock-0"
spec:
  containers:
    - name: model
      image: busybox:1.36
      command: ["sleep", "infinity"]
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 10000
