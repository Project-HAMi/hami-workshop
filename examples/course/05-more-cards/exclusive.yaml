apiVersion: v1
kind: Pod
metadata:
  name: exclusive
  annotations:
    hami.io/gpu-scheduler-policy: mutex
spec:
  containers:
    - name: model
      image: busybox:1.36
      command: ["sleep", "infinity"]
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 10000
