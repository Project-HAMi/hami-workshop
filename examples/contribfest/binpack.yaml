# Lab 2: per-Pod GPU policy. Both Pods should land on the same card.
apiVersion: v1
kind: Pod
metadata:
  name: pack-1
  annotations:
    hami.io/gpu-scheduler-policy: binpack
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "86400"]
    resources:
      limits:
        nvidia.com/gpu: 1
        nvidia.com/gpumem: 15000
        nvidia.com/gpucores: 30
---
apiVersion: v1
kind: Pod
metadata:
  name: pack-2
  annotations:
    hami.io/gpu-scheduler-policy: binpack
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "86400"]
    resources:
      limits:
        nvidia.com/gpu: 1
        nvidia.com/gpumem: 15000
        nvidia.com/gpucores: 30
