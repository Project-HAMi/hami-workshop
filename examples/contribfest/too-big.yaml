# Lab 2: 45000 MB does not fit on any 40960 MB card. Expect Pending with CardInsufficientMemory.
apiVersion: v1
kind: Pod
metadata:
  name: too-big
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "86400"]
    resources:
      limits:
        nvidia.com/gpu: 1
        nvidia.com/gpumem: 45000
        nvidia.com/gpucores: 30
